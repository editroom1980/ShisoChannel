# 宍粟市の行政案内データベース(shiso_kb.json)と観光スポット(shiso_kanko.json)を
# 週1回まとめて取り直す。テレビ用アプリのAIが「担当課と直通電話つきの正確な案内」を
# するための資料（scripts/build_shiso_kb.py ／ scripts/build_shiso_kanko.py）。
# 市のページは頻繁には変わらないので週1回で足りる。1ページごとに間をあけて集めるため
# 30分ほどかかる＝お知らせ(city-news)とは別の流れにしてある。
name: shiso-kb

on:
  schedule:
    - cron: '0 18 * * 0'      # 毎週月曜 3:00 JST（日曜18:00 UTC）
  workflow_dispatch:           # 手動実行も可能（Actionsタブから）

permissions:
  contents: write

concurrency:
  group: shiso-kb
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90     # v2で全文・全ページ収集になり長くなった（実測40分＋余裕）
    steps:
      - uses: actions/checkout@v4
      - name: PDFを画像にする道具（ごみカレンダー用）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: 行政案内を集める（市公式サイト・全文＋表＋添付）
        id: kb
        continue-on-error: true    # ★1つの取り込みが失敗しても、他の収集結果は捨てない
        run: python3 scripts/build_shiso_kb.py 3000
      - name: 観光スポットを集める（観光協会公式ガイド）
        id: kanko
        continue-on-error: true    # ★1つの取り込みが失敗しても、他の収集結果は捨てない
        run: python3 scripts/build_shiso_kanko.py
      - name: ごみカレンダーを集める（地区表＋PDF→画像）
        id: gomi
        continue-on-error: true    # ★1つの取り込みが失敗しても、他の収集結果は捨てない
        run: python3 scripts/build_shiso_gomi.py
      - name: 条例・規則の索引を集める（例規集）
        id: reiki
        continue-on-error: true    # ★1つの取り込みが失敗しても、他の収集結果は捨てない
        run: python3 scripts/build_shiso_reiki.py
      - name: 主要PDFの中身を文章にする（手引き・しおり・時刻表）
        id: pdf
        continue-on-error: true    # ★1つの取り込みが失敗しても、他の収集結果は捨てない
        run: python3 scripts/build_shiso_pdf.py
      - name: 施設の一覧を作る（学校・こども園・避難所）
        id: shisetsu
        continue-on-error: true    # ★1つの取り込みが失敗しても、他の収集結果は捨てない
        run: python3 scripts/build_shiso_shisetsu.py
      - name: バス時刻表を作る（地区表→ページ画像）
        id: bus
        continue-on-error: true    # ★1つの取り込みが失敗しても、他の収集結果は捨てない
        run: python3 scripts/build_shiso_bus.py
      - name: 逸話・民話を集める（山崎文化協会「しそうの逸話」）
        id: bunka
        continue-on-error: true    # ★1つの取り込みが失敗しても、他の収集結果は捨てない
        run: python3 scripts/build_shiso_bunka.py
      - name: 休日当番医と医療機関を集める（宍粟市医師会）
        id: iryo
        continue-on-error: true    # ★当番医は毎月変わる。ここが止まると命に関わる案内が古びる
        run: python3 scripts/build_shiso_iryo.py
      - name: 表計算を読む道具（人口の統計はExcelで出ている）
        run: python3 -m pip install --quiet xlrd openpyxl
      - name: 人口の移り変わりを作る（市公式「年度別人口統計」）
        id: jinko
        continue-on-error: true    # ★毎月更新される。止まると人口の答えが古びる
        run: python3 scripts/build_shiso_jinko.py
      - name: 広報しそうを集める（毎月の号）
        id: koho
        continue-on-error: true    # ★新しい号が出るたびに増える。市の話題の一次資料
        run: python3 scripts/build_shiso_koho.py
      - name: 市の予算・決算を拾う（広報しそうから）
        id: yosan
        continue-on-error: true    # ★広報を取り直した後に走らせる（広報が元なので順番が要る）
        run: python3 scripts/build_shiso_yosan.py
      - name: お祭りを拾う（広報しそうから）
        id: matsuri
        continue-on-error: true    # ★同上。広報の後
        run: python3 scripts/build_shiso_matsuri.py
      - name: よくある質問を集める（市公式FAQ）
        id: faq
        continue-on-error: true
        run: python3 scripts/build_shiso_faq.py
      - name: 市議会の議員名簿を集める
        id: gikai
        continue-on-error: true
        run: python3 scripts/build_shiso_gikai.py
      - name: 指定文化財を集める（文化財保存活用地域計画 資料編）
        id: bunkazai
        continue-on-error: true
        run: python3 scripts/build_shiso_bunkazai.py
      - name: 学校（今ある学校と閉校した学校）を作る
        id: gakko
        continue-on-error: true
        run: python3 scripts/build_shiso_gakko.py
      - name: 行政区ごとの人口を作る（毎月更新）
        id: gyousei
        continue-on-error: true
        run: python3 scripts/build_shiso_gyousei.py
      - name: 市の基本の情報を作る（面積・市の花と木・合併・市歌）
        id: kihon
        continue-on-error: true
        run: python3 scripts/build_shiso_kihon.py
      - name: 議会だよりを集める（PDF。画像だけの号は文字読み取り）
        id: gikaidayori
        continue-on-error: true
        run: python3 scripts/build_shiso_gikaidayori.py 12
      - name: 新病院の要点を作る（開院時期・建設地・工事の進み）
        id: shinbyoin
        continue-on-error: true
        run: python3 scripts/build_shiso_shinbyoin.py
      - name: 助成・補助の一覧を作る
        id: josei
        continue-on-error: true
        run: python3 scripts/build_shiso_josei.py
      - name: 相談窓口の一覧を作る
        id: soudan
        continue-on-error: true
        run: python3 scripts/build_shiso_soudan.py
      - name: 公共施設の一覧を作る（開館時間・電話・バリアフリー）
        id: kokyo
        continue-on-error: true
        run: python3 scripts/build_shiso_kokyo.py
      - name: 市への行き方を作る（三宮・姫路・車・駐車場）
        id: access
        continue-on-error: true
        run: python3 scripts/build_shiso_access.py
      - name: 証明書の手数料を作る（PDFの表から）
        id: tesuryo
        continue-on-error: true
        run: python3 scripts/build_shiso_tesuryo.py
      - name: 資料の見取り図を作る
        id: ichiran
        continue-on-error: true
        run: python3 scripts/shiryo_ichiran.py
      - name: 変化があればコミット
        if: always()    # ★どれかが失敗しても、取れた分は必ず保存する
        run: |
          git add -A shiso_kb.json shiso_kanko.json shiso_gomi.json shiso_reiki.json shiso_pdf.json shiso_shisetsu.json shiso_bus.json shiso_bunka.json shiso_iryo.json shiso_jinko.json shiso_koho.json shiso_yosan.json shiso_matsuri.json shiso_faq.json shiso_gikai.json shiso_bunkazai.json shiso_gakko.json shiso_gyousei.json shiso_kihon.json shiso_gikaidayori.json shiso_shinbyoin.json shiso_josei.json shiso_soudan.json shiso_kokyo.json shiso_access.json shiso_tesuryo.json shiryo_ichiran.json gomi_cal bus_cal
          if git diff --cached --quiet; then
            echo "変化なし"
          else
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: 行政案内・観光・ごみカレンダー・例規を自動更新'
            git pull --rebase origin main
            git push
          fi
      - name: 取り込めなかったものがあれば知らせる
        if: always()
        run: |
          # ★1つでも取り込めなかったら、この実行は失敗にする（2026-08-23）。
          #   黙って古い資料のまま緑になると、更新が止まっていることに気づけない。
          #   ただし取れた分はすでにコミット済みなので、79分の作業は無駄にならない。
          #   ※シェルの変数名に日本語は使えないので英字にしてある
          missing=""
          if [ "${{ steps.kb.outcome }}"       = "failure" ]; then missing="$missing 行政案内"; fi
          if [ "${{ steps.kanko.outcome }}"    = "failure" ]; then missing="$missing 観光"; fi
          if [ "${{ steps.gomi.outcome }}"     = "failure" ]; then missing="$missing ごみ"; fi
          if [ "${{ steps.reiki.outcome }}"    = "failure" ]; then missing="$missing 例規"; fi
          if [ "${{ steps.bunka.outcome }}"    = "failure" ]; then missing="$missing 逸話"; fi
          if [ "${{ steps.iryo.outcome }}"     = "failure" ]; then missing="$missing 当番医"; fi
          if [ "${{ steps.pdf.outcome }}"      = "failure" ]; then missing="$missing PDF"; fi
          if [ "${{ steps.shisetsu.outcome }}" = "failure" ]; then missing="$missing 施設"; fi
          if [ "${{ steps.bus.outcome }}"      = "failure" ]; then missing="$missing バス"; fi
          if [ -n "$missing" ]; then
            echo "::error::取り込めなかった資料:$missing（ほかの資料は保存済み）"
            exit 1
          fi
          echo "すべての資料を取り込めました"
