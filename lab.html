<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e3a28"><!-- ノッチ帯(ビューポート外)の色をiOSへ明示指定。全画面出入り後の黒残り対策(サンプリング推測を無効化する狙い) -->
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>しそチャンNET LAB（操作改善テスト）</title>
<link rel="apple-touch-icon" href="icon-180.png?v=132">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=132">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="しそチャンNET">
<link rel="apple-touch-icon" href="icon-180.png?v=132">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=132">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap');
/* タイトル用フォント コーポレートロゴB（Corporate Logo Bold・OFLベース）。タイトル文字だけにサブセット済(約1KB) */
@font-face{font-family:'CorpLogoB';src:url('corp-logo-b.woff2?v=1') format('woff2');font-weight:700;font-display:swap;}
:root{
  --forest:#1e3a28;--green:#2d5c3e;--green2:#3d7a54;--green3:#52a070;
  --green4:#a8d5b5;--green5:#e4f2e8;--gold:#c8992a;--gold2:#e8b84a;
  --white:#fff;--off:#f6f8f6;--border:#d4e0d6;
  --text:#1a2520;--text2:#4a5e52;--text3:#8aa090;--red:#b83030;
  /* 全モード共通のバナー基準幅＝画面短辺−左右余白12px（＝縦の動画ウインドウ幅390・全間隔6px統一）。縦横問わず一定 */
  --banner-w:calc(100vmin - 12px);
  /* バナーの見かけ高さ（クロップ後の実表示比率2277:193.2）と、横向きヘッダー高さ（=バナー高+上下6px=間隔A） */
  --banner-h:calc((100vmin - 12px) * 193.2 / 2277);
  --hdrL:calc((100vmin - 12px) * 193.2 / 2277 + 12px);
  /* 番組表/お知らせの見出し帯：背景の深緑(--forest)と区別できる少し明るい緑 */
  --band:#2f5f42;
}
*{box-sizing:border-box;margin:0;padding:0;}
/* テキスト選択・長押しメニューを無効化 */
body{
  -webkit-user-select:none;
  -moz-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
html{background:var(--forest);}
/* bodyの背景を深緑に。iOS standaloneは最下部の安全領域をbody背景色で塗るため、これで白帯が消える。本編の明るい背景は#main-contentに持たせる */
body{background:var(--forest);color:var(--text);font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;font-size:14px;min-height:100vh;}

/* ══ 電源画面 ══ */
#power-screen{position:fixed;inset:0;z-index:999;background:var(--forest);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.ps-logo-main{font-family:'CorpLogoB','Zen Kaku Gothic New',sans-serif;font-size:32px;font-weight:700;color:var(--white);letter-spacing:0.077em;}
/* NET(英字)はこの書体だとカナより小さく見えるので1.125倍。ベースライン-0.062em下げてカナと高さ(中心)を合わせる */
.ps-logo-main em{color:var(--gold2);font-style:normal;font-size:1.125em;vertical-align:-0.062em;}
.ps-version{font-size:11px;color:var(--gold2);letter-spacing:2px;margin-top:12px;font-weight:600;}
.ps-clock{font-size:52px;font-weight:200;color:var(--white);letter-spacing:4px;font-variant-numeric:tabular-nums;}
.ps-date-str{font-size:22px;font-weight:300;color:rgba(255,255,255,0.65);letter-spacing:2px;margin-bottom:-6px;}
.ps-btn{margin-top:8px;background:var(--gold);color:var(--forest);border:none;cursor:pointer;font-size:16px;font-weight:700;padding:16px 52px;border-radius:4px;letter-spacing:3px;font-family:inherit;-webkit-tap-highlight-color:transparent;user-select:none;}
.ps-btn:active{opacity:0.85;}
.ps-btn.loading{opacity:0.55;pointer-events:none;cursor:default;letter-spacing:2px;}
.ps-hint{font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:1px;}

/* ══ ヘッダー ══ */
#main-content{display:none;background:var(--forest);}/* 余白を深緑に統一（ノッチ帯=システムが塗る深緑と一致・縦横一貫）。カード/動画は各自の背景で不変 */
.header{
  background:var(--forest);
  padding:0 24px;
  /* safe-area-inset-topでステータスバー分を確保（被らないように） */
  padding-top:max(0px, calc(env(safe-area-inset-top) - 8px));
  min-height:calc(60px + max(0px, calc(env(safe-area-inset-top) - 8px)));
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;row-gap:4px;column-gap:14px;
  position:sticky;top:0;z-index:300;
  /* 影は除去：下の深緑余白との境界に影が落ちて色味が違って見えるのを防ぐ（余白を完全に均一な深緑に） */
}
.h-logo{display:flex;flex-direction:row;align-items:center;gap:8px;flex-shrink:0;}
/* 情報バー内のスポンサーバナー（横向き=ロゴと時間の間で中央／縦向き=ロゴ行の下に全幅） */
.h-banner{flex:1 1 auto;min-width:0;display:flex;justify-content:center;align-items:center;overflow:hidden;cursor:pointer;padding:3px 0;-webkit-tap-highlight-color:transparent;}
/* バナーの寸法は共通の .sponsor-img（②の見えている幅=--banner-w 構造）に一本化 */
/* スマホ縦(幅767px以下)のみ2段(バナーは基準幅で中央)。iPad等の広い縦画面は横向きと同じ1列(ロゴと時計の間) */
/* 向きの切り替えは凍結しないJS判定(body.ori-p/.ori-l)で行う。iOSはアプリ内ブラウザ復帰時にCSSの向き判定を凍結させるため@media(orientation)は使わない */

  /* バナー(390)が収まるようヘッダー左右余白をページ余白(6px)に合わせる（間隔6px統一） */
  body.ori-p .header{justify-content:space-between;row-gap:0;padding-bottom:0;padding-left:6px;padding-right:6px;}body.ori-p .h-right{order:1;}
  /* ③バナー下の余白は0にし、動画ウインドウとの間隔=ページ上余白6px（間隔Aと同一）だけにする。
     上余白はロゴ行→バナーの間隔=6px（間隔統一・2026-08-09指示） */
  body.ori-p .h-banner{order:2;flex-basis:100%;padding:6px 0 0;}

/* 試験放送中バッジ（ヘッダー用・起動画面用）＋番組表の時刻非表示 */
.test-badge{border:1.5px solid var(--gold2);color:var(--gold2);font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:4px;white-space:nowrap;background:rgba(0,0,0,0.15);flex-shrink:0;}
.ps-test-badge{display:inline-block;border:2px solid var(--gold2);color:var(--gold2);font-size:13px;font-weight:700;letter-spacing:2px;padding:5px 16px;border-radius:6px;margin-top:16px;}
.time-bar{display:none;}
.h-logo-main{font-family:'CorpLogoB','Zen Kaku Gothic New',sans-serif;font-size:20px;font-weight:700;color:var(--white);letter-spacing:0.077em;}
.h-logo-main em{color:var(--gold2);font-style:normal;font-size:1.125em;vertical-align:-0.062em;}
.h-right{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.h-datetime{display:flex;flex-direction:column;align-items:flex-end;}
.h-date{font-size:10px;color:rgba(255,255,255,0.45);letter-spacing:1px;}
.h-time{font-size:22px;font-weight:300;color:rgba(255,255,255,0.85);letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1.1;}
.onair-badge{display:flex;align-items:center;gap:6px;border:1px solid var(--red);color:#fff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:2px;letter-spacing:2px;background:rgba(184,48,48,0.2);}
.onair-badge.off{border-color:var(--text3);background:rgba(100,100,100,0.15);}
.bdot{width:6px;height:6px;background:#ff6060;border-radius:50%;animation:blink 1.4s infinite;}
.bdot.grey{background:var(--text3);animation:none;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

/* ══ ページレイアウト（PC/Mac） ══ */
.page{
  margin:0;
  padding:16px 16px 40px;
  display:grid;
  grid-template-columns:1fr 300px;
  grid-template-rows:1fr auto;
  grid-template-areas:
    "player guide"
    "player news";
  gap:16px;
}
.player-col{grid-area:player;min-width:0;}
.sidebar{grid-area:guide;}
.newsbar{grid-area:news;}

/* ══ 左カラム：プレイヤーエリア ══ */

/* タイトルバー */
.viewing-bar{
  background:var(--white);
  border-radius:6px 6px 0 0;
  padding:8px 14px;
  display:flex;align-items:center;gap:8px;
  min-height:44px;
}
/* ●LIVE部分のみクリック可能 */
.live-tap{cursor:pointer;display:flex;align-items:center;gap:8px;flex-shrink:0;}
#viewing-title{font-size:15px;font-weight:700;color:var(--text);line-height:1.5;}
.cat-tag{font-size:10px;font-weight:700;color:var(--green2);background:var(--green5);border:1px solid var(--border);padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-top:2px;}

/* プレイヤー本体 */
.player-wrap{
  position:relative;padding-bottom:56.25%;
  overflow:hidden;box-shadow:0 4px 20px rgba(30,58,40,0.15);background:#000;
  isolation:isolate;
}
/* iframeへのマウスイベントを完全遮断→YouTubeのUI表示を防ぐ */
#yt-mouse-block{
  position:absolute;inset:0;
  z-index:5;
  background:transparent;
  cursor:default;
  pointer-events:auto;
  transition:background 0.1s;
}
/* cover無し＝YouTubeは映像を寄せない（縦向きで実証済み）ので、枠を16:9のまま±数pxだけオーバースキャンして
   完全に覆う（サブピクセルの黒線対策のみ・相殺は入れない＝ズレ無し）。非ノッチ機種も同じ。 */
#yt-player-api{position:absolute;z-index:1;
  left:-3px;top:-1.6875px;right:auto;bottom:auto;
  width:calc(100% + 6px);height:calc(100% + 3.375px);
}
#yt-player-api iframe{pointer-events:none;}
#yt-player-api iframe{pointer-events:none;}

#ended-ov{position:absolute;inset:0;z-index:35;background:var(--forest);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#sw-ov{position:absolute;inset:0;z-index:30;background:rgba(30,58,40,0.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.ended-icon{font-size:38px;opacity:0.5;}
.ended-ttl{font-size:17px;font-weight:700;color:rgba(255,255,255,0.75);letter-spacing:2px;text-align:center;padding:0 20px;}
.ended-sub{font-size:12px;color:rgba(255,255,255,0.35);letter-spacing:1px;}
/* 番組表の読み込み中/失敗オーバーレイ＋再読み込みボタン */
#loaderr-ov{position:absolute;inset:0;z-index:36;background:var(--forest);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 20px;text-align:center;}
#loaderr-sub{max-width:340px;line-height:1.7;}
.reload-btn{margin-top:6px;display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--forest);border:none;cursor:pointer;font-size:16px;font-weight:700;padding:13px 30px;border-radius:6px;font-family:inherit;-webkit-tap-highlight-color:transparent;}
.reload-btn:active{opacity:0.85;}
.sw-spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.sw-lbl{font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:2px;}

/* 疑似全画面タイトルバー */


/* 疑似全画面ボタン（スマホのみ・YT全画面ボタンに重なる透明ボタン） */
/* 疑似全画面ボタン（拡大・閉じる）
   player-wrap内に position:absolute で配置
   YouTubeのiframeの全画面ボタンと同じ右下位置に重ねる
   スマホのみ表示 */
/* ══ live-bar（LIVEバー + 拡大ボタンのコンテナ） ══ */
/* LIVEボタン：flex-grow で残りスペースを埋める */
.live-bar /* 拡大ボタン：右端に固定・スマホのみ表示 */
.expand-open-btn{
  display:none; /* デフォルト非表示 */
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:0 14px;
  border:none;
  border-left:1px solid var(--border);
  background:var(--white);
  color:var(--green2);
  font-size:24px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
  flex-shrink:0;
}
.expand-open-btn:active{background:transparent;}
/* 全デバイスで拡大ボタンを表示 */
@media(pointer:coarse),
(pointer:fine){
  .expand-open-btn{display:flex;}
}
/* 向きの切り替えは凍結しないJS判定(body.ori-p/.ori-l)で行う。iOSはアプリ内ブラウザ復帰時にCSSの向き判定を凍結させるため@media(orientation)は使わない */
body.ori-l .expand-open-btn{display:flex;}


/* 全画面ボタン専用ブロック */
#yt-block-fs{
  position:absolute;
  bottom:81px;
  right:0;
  width:75px;
  height:50px;
  z-index:10;
  background:transparent;
  cursor:default;
  pointer-events:auto;
  -webkit-tap-highlight-color:transparent;
}

/* 疑似全画面状態 */
.player-wrap.expanded{
  position:fixed;inset:0;z-index:500;
  border-radius:0;border:none;box-shadow:none;
  /* 疑似全画面は inset:0 でビューポートちょうどに収める（幅高はinsetに任せる=auto）。
     iOS横向きでは 100vw が実可視幅より広くなり映像が右へはみ出して切れるため、100vw/100vhは使わない。 */
  width:auto !important;
  height:auto !important;
  padding:0 !important;
  margin:0 !important;
}
.player-wrap.expanded #yt-player-api{position:absolute;inset:0;}
.player-wrap.expanded #yt-player-api iframe{width:100%;height:100%;}
body.fs-open{
  overflow:hidden;
  /* ★全画面中は body も黒。帯色の公式フォールバック元はbody背景のため（v1.91で緑にしたのは誤った理論に基づく残骸。
     解除時の左右帯の緑化は_exitOvオーバーレイ機構が担うためbody色とは無関係＝黒に戻して安全）。
     bodyは黒いオーバーレイの下で不可視＝見た目への影響ゼロ。 */
  background:#000;
  margin:0;
  padding:0;
}
/* 疑似全画面中：player-wrapを全画面に */
body.fs-open .player-wrap.expanded{
  top:0 !important;
  background:#000;
}
/* ★全画面中：縦向きの上部安全領域(深緑が残る箇所)を同じ面積の黒帯で覆う（ユーザー指示）。
   高さ=env(safe-area-inset-top)なので縦=62px/横=0px(自動で消える)。演出なし・常時表示のただの黒。 */
body.fs-open::before{
  content:'';position:fixed;top:0;left:0;right:0;
  height:env(safe-area-inset-top);
  background:#000;z-index:100001;pointer-events:none;
}
/* ★iOS26はステータスバー帯の色を「上端付近のfixed/sticky要素のbackground-color」から自動採取する（文書化済み仕様・
   theme-colorは無視される）。通常時の帯の緑の供給源は position:sticky の .header(深緑)。全画面中はその採取元を黒にする。
   ヘッダーは全画面オーバーレイ(z500)の下で見えないため、見た目への影響はゼロ＝帯の採取色だけが黒になる。 */
body.fs-open .header{ background:#000; }

/* ══ YouTubeボタンブロックレイヤー ══ */
/* 共有ボタン（左端）・YouTubeロゴ（右端）のみブロック、シークバーは通す */
.yt-block{
  position:absolute;
  z-index:10;
  background:transparent;
  cursor:default;
  pointer-events:auto;
  -webkit-tap-highlight-color:transparent;
}
/* 赤: 再生ボタン・共有ボタン領域（音量ボタンを露出するため48pxに） */
#yt-block-left{
  left:0;
  bottom:0;
  width:90px;
  height:64px;
}
/* 青: YouTubeロゴ・その他の動画 */
#yt-block-right{
  right:0;
  bottom:0;
  width:177px;
  height:64px;
}
/* 上部タイトルバーブロック（左側のチャンネル名・アイコンのみ） */
#yt-block-top{
  position:absolute;
  top:0; left:0;
  width:100%;
  height:80px;
  z-index:2147483647;
  background:transparent;
  cursor:default;
  pointer-events:auto;
  -webkit-tap-highlight-color:transparent;
}
/* 設定ボタン（⚙）をブロック */
#yt-block-settings{
  position:absolute;
  top:0; right:0;
  width:80px;
  height:65px;
  z-index:10;
  background:transparent;
  cursor:default;
  pointer-events:auto;
  -webkit-tap-highlight-color:transparent;
}
/* 疑似全画面中も有効 */
.player-wrap.expanded .yt-block,
.player-wrap.expanded #yt-block-top{
  position:absolute;
  top:0; left:0;
  width:100%;
  height:80px;
  z-index:2147483647;
  background:transparent;
  cursor:default;
  pointer-events:auto;
  -webkit-tap-highlight-color:transparent;
}
/* PC全画面時（requestFullscreen） */
.player-wrap:fullscreen{
  position:fixed;inset:0;
  padding-bottom:0;background:#000;
  width:100vw;height:100vh;
  margin:0;border:none;box-shadow:none;border-radius:0;
}
.player-wrap:-webkit-full-screen{
  position:fixed;inset:0;
  padding-bottom:0;background:#000;
  width:100vw;height:100vh;
  margin:0;border:none;box-shadow:none;border-radius:0;
}

.player-wrap:fullscreen #yt-player-api{position:absolute;inset:0;}
.player-wrap:fullscreen #yt-player-api iframe{width:100%;height:100%;}
/* 全画面中のUIボタン */
.player-wrap:fullscreen .expand-close-btn{display:none;}
.player-wrap:-webkit-full-screen .expand-close-btn{display:none;}

/* 閉じるボタン：疑似全画面中のみ表示・右下固定（2倍サイズ） */
.expand-close-btn{
  display:none;
  position:absolute;
  bottom:20px;right:24px;
  z-index:40;
  align-items:center;justify-content:center;gap:0;
  padding:0;width:44px;height:44px;
  border-radius:8px;border:none;cursor:pointer;
  background:rgba(0,0,0,0.65);
  color:#fff;font-weight:700;
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
  transition:opacity 0.3s;
}
.player-wrap.expanded .expand-close-btn{
  display:none;
}

/* ══ LIVEボタン（タイトルバーと同じ高さ・同じパディング） ══ */
.ldot{width:7px;height:7px;background:var(--red);border-radius:50%;animation:blink 1.4s infinite;flex-shrink:0;}
.ldot.g{background:var(--text3);animation:none;}
.llbl{font-size:10px;font-weight:700;letter-spacing:2px;flex-shrink:0;}
.llbl.r{color:var(--red);}
.ldiv{width:1px;height:14px;background:var(--border);flex-shrink:0;}
/* ══ プログレスバー（タイトルバーと同じ高さ） ══ */
.pt{font-size:12px;color:var(--text3);white-space:nowrap;font-variant-numeric:tabular-nums;}
.bar-bg{flex:1;height:5px;background:var(--green5);border-radius:3px;overflow:visible;cursor:pointer;touch-action:none;position:relative;}
/* 見た目は細いまま、指で掴める当たり判定を上下に拡張（ドラッグの反応向上） */
.bar-bg::before{content:"";position:absolute;left:0;right:0;top:-16px;bottom:-16px;}
/* 中央の半透明・再生ボタン（一時停止中のみ表示。視覚のみ＝タップは既存の画面タップ再生に委ねる） */

#center-play svg{width:42px;height:42px;margin-left:3px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
/* 出典テロップ（見始めから10秒・映像右下に座布団付き）。位置はfitPlayerで映像の右下に合わせる */
#video-telop{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:7;white-space:nowrap;
  background:rgba(0,0,0,0.6);color:#fff;font-size:12px;line-height:1.4;
  padding:5px 10px;border-radius:6px;display:none;opacity:1;transition:opacity .5s;
  pointer-events:none;text-align:center;letter-spacing:.01em;}
#video-telop.telop-hide{opacity:0;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--green2),var(--green3));border-radius:3px;transition:width .8s linear;width:0%;}
.bar-fill.no-transition{transition:none !important;}
/* ══ 次の番組（タイトルバーと同じ高さ） ══ */
/* ══ カスタムコントロールバー ══ */
.custom-ctrl{
  display:flex;align-items:center;
  background:var(--white);
  border-radius:0 0 6px 6px;
  padding:0 16px;
  height:44px;
  overflow:visible;
  gap:14px;
}
.custom-ctrl>*{flex-shrink:0;}
.custom-ctrl .bar-bg{flex:1;margin:0;}
.ctrl-btn{
  display:flex;align-items:center;justify-content:center;
  min-width:36px;height:36px;
  border:none;border-radius:4px;background:transparent;
  color:var(--green2);cursor:pointer;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;font-family:inherit;
}
.ctrl-btn:hover,.ctrl-btn:active{background:transparent;}
.vol-slider{
  width:50px;height:4px;
  -webkit-appearance:none;appearance:none;
  background:var(--green4);border-radius:2px;
  outline:none;cursor:pointer;flex-shrink:0;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:18px;height:18px;border-radius:50%;
  background:var(--green2);cursor:pointer;
}

/* ctrl-btnクラスのmin-width/heightを正方形で上書き */


.custom-ctrl .bar-bg{flex:1;cursor:pointer;}
.custom-ctrl .expand-open-btn{
  border:none;
  background:var(--white);
  color:var(--green2);
  padding:0;
  width:36px;height:36px;
  display:flex !important;
  align-items:center;justify-content:center;
  min-width:auto;
}
/* ══ 番組表サイドバー ══ */
.sidebar{
  background:var(--white);border-radius:6px;
  overflow:hidden;
  box-shadow:0 2px 12px rgba(30,58,40,0.08);
  /* 左カラムと同じ高さになるよう sticky + max-height で制御 */
  position:sticky;top:76px;
  max-height:calc(100vh - 92px);
  display:flex;flex-direction:column;
}
.sb-head{
  background:var(--band);padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.sb-ttl{font-size:12px;font-weight:700;color:var(--white);letter-spacing:3px;white-space:nowrap;flex-shrink:0;}
#today-date{font-size:10px;color:rgba(255,255,255,0.5);white-space:nowrap;}
/* 見出し帯の補足文（出典・操作案内）。縦向きで余裕がある時のみ表示（横向きは非表示） */
.sb-note{font-size:9px;color:rgba(255,255,255,0.55);letter-spacing:0.5px;margin-left:1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;text-align:left;}

/* 番組リスト：スクロール可能 */
.sb-list{
  overflow-y:auto;flex:1;min-height:0;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  overscroll-behavior:contain;
}

/* 番組行 */
.prow{
  display:flex;flex-direction:column;
  border-bottom:1px solid var(--border);
  cursor:pointer;position:relative;
  -webkit-tap-highlight-color:transparent;
}
.prow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;}
.prow.active{background:var(--green5);}
/* 放送中セルは薄緑のみ（左端の深緑ストリップは廃止）。現在時刻の時刻チップ強調は別途維持 */

/* 時刻バー（タイトル上・横並び） */
.time-bar{
  display:flex;align-items:center;
  padding:5px 12px 3px;
  border-bottom:1px solid var(--green5);
  gap:0;flex-wrap:nowrap;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.time-bar::-webkit-scrollbar{display:none;}
.time-chip-item{
  font-size:10px;font-weight:600;color:var(--text3);
  padding:1px 4px;border-radius:2px;
  white-space:nowrap;flex-shrink:0;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background .1s,color .1s;
}
.time-chip-item:active{background:var(--green4);color:var(--forest);}
.time-chip-item.on{color:var(--white);background:var(--green2);}
.time-sep{font-size:8px;color:var(--border);padding:0 2px;flex-shrink:0;user-select:none;}

/* 番組情報エリア */
.pinfo{padding:6px 12px 8px;display:flex;flex-direction:column;gap:3px;}
.pname{font-size:13px;font-weight:600;color:var(--text);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.prow.active .pname{color:var(--green);font-weight:700;}
.pmeta{display:flex;align-items:center;gap:6px;}
.pcat{font-size:11px;font-weight:700;color:var(--green2);}
.pdur{font-size:11px;color:var(--text3);}

/* ══ 宍粟市お知らせ・イベント（番組表と同形式の独立ウインドウ・データがある時のみ表示） ══ */
.newsbar{
  background:var(--white);border-radius:6px;
  overflow:hidden;box-shadow:0 2px 12px rgba(30,58,40,0.08);
  display:flex;flex-direction:column;flex-shrink:0;
}
.news-body{padding:7px 12px 8px;display:flex;flex-direction:column;justify-content:center;gap:3px;}
.news-item{display:flex;flex-direction:column;gap:3px;}
.news-tag{align-self:flex-start;font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;letter-spacing:1px;}
.news-tag.notice{background:var(--green4);color:var(--forest);}
.news-tag.event{background:#f2e3c4;color:#8a6414;}
.news-tag.warn{background:#f7dada;color:#8a1f1f;}
.news-ttl.warn{color:#8a1f1f;font-weight:700;}
.news-ttl{font-size:12px;color:var(--text);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* 縦向きスマホ: ジャンルタグとタイトルを1行に（2026-08-09指示。横向きは従来の2段のまま）
   ※基本定義(.news-item)より後に書くこと（前に書くと後勝ちで打ち消される=v2.16の失敗） */
/* 向きの切り替えは凍結しないJS判定(body.ori-p/.ori-l)で行う。iOSはアプリ内ブラウザ復帰時にCSSの向き判定を凍結させるため@media(orientation)は使わない */
body.ori-p .news-item{flex-direction:row;align-items:center;gap:7px;}body.ori-p .news-tag{align-self:center;flex-shrink:0;}body.ori-p .news-ttl{flex:1 1 auto;min-width:0;}
  /* 画面最下部のホームインジケーター(アプリ切替の下線)と被らないよう、窓を少し縦に広げ
     タグ+タイトルを上へ寄せる（上7px/下22px・2026-08-09指示） */
  body.ori-p .news-body{padding:7px 12px 22px;}


/* ══ レスポンシブ ══ */

/* iPhone縦向き: 番組表を横向き同様「1画面固定＋内側スクロール」に（iPhone限定・iPad/PC非影響） */
/* 向きの切り替えは凍結しないJS判定(body.ori-p/.ori-l)で行う。iOSはアプリ内ブラウザ復帰時にCSSの向き判定を凍結させるため@media(orientation)は使わない */
body.iphone-mode.ori-p{
    height:100vh;
    /* --vpH: 表示領域の高さが凍った時だけ、JSが端末実寸法から算出した正しい高さを入れる。通常は未設定＝100dvh */
    height:var(--vpH, 100dvh);
    min-height:0;
    overflow:hidden;
  }body.iphone-mode.ori-p .page{
    grid-template-rows:auto 1fr auto;
    height:calc(100vh - var(--hdr-h, 84px));
    height:calc(var(--vpH, 100dvh) - var(--hdr-h, 84px));
    overflow:hidden;
    padding-bottom:6px;
  }body.iphone-mode.ori-p .sidebar{
    position:static;
    height:100%;
    min-height:0;
    max-height:100%;
    overflow:hidden;
  }


/* スマホ横画面：動画(左) ＋ 番組表(右) */
/* 向きの切り替えは凍結しないJS判定(body.ori-p/.ori-l)で行う。iOSはアプリ内ブラウザ復帰時にCSSの向き判定を凍結させるため@media(orientation)は使わない */

  /* 横向きは画面全体をスクロールさせない（番組表内だけスクロール） */
  html.ori-l,
body.ori-l{overflow:hidden;height:100%;}
  /* ページ全体: 動画幅を正確に計算して余白なし */
  /* 動画高さ = 100vh - ヘッダー(--hdrL) - viewing-bar34 - ctrl34 - ページ下余白6 = 100vh - hdrL - 74px */
  /* 動画幅 = 動画高さ × 16/9 */
  body.ori-l .page{
    grid-template-columns:calc((100vh - var(--hdrL) - 74px) * 16 / 9) 1fr;
    grid-template-rows:1fr auto;
    grid-template-areas:
      "player guide"
      "player news";
    /* ★ノッチ回避：左右にsafe-area分の余白を確保し、動画ウインドウ/番組表をノッチの内側へピッタリ寄せる。
       非ノッチ端末では env()=0 なので余白ゼロ＝無駄な余白なし。余白色は既存のまま（縦画面と同じ）＝勝手に変えない。
       ★上余白は0：バナー→動画の間隔はヘッダー下側の6px(間隔A)のみ＝合計6px。下余白は6px(間隔統一) */
    padding:0 max(6px, env(safe-area-inset-right)) 6px max(6px, env(safe-area-inset-left));
    gap:6px;
    align-items:start;
    height:calc(100vh - var(--hdrL));
    overflow:hidden;
    box-sizing:border-box;
  }
  /* 横向きは番組表のstickyオフセットを無効化＝上端を動画に揃える */
  body.ori-l .sidebar{position:static;top:auto;}
  /* ヘッダー: 高さ＝バナー高＋上下6px(間隔A)ずつ（④バナーの上下余白=間隔A・少し下がる） */
  body.ori-l .header{
    height:var(--hdrL);
    min-height:0;
    padding-top:0;
    padding-left:max(10px, env(safe-area-inset-left));
    padding-right:max(10px, env(safe-area-inset-right));
    column-gap:0;   /* バナー幅386を確保するため列間ギャップは0（左右の隙間はセンタリングで自然に生まれる） */
    position:relative;
  }
  /* 横向きのバナーはロゴ群と時刻群の「間」で自動センタリング（重なり構造ゼロ・幅は--banner-w=386のまま） */
  body.ori-l .h-banner{padding:0;}body.ori-l .h-date{display:none;}
  /* ①文字サイズは縦向きと完全に同一（15/15/9/9）。max-width:840だけに頼ると全画面(cover)中は
     内部画面幅が750→874に広がって条件から外れ、ヘッダーがPC文字で別レイアウトになる
     （v2.11の回転バナー位置ズレの原因）。この横向きブロック(高さ500px以下)は874でも効くためここに明記 */
  body.ori-l .h-logo-main{font-size:15px;}body.ori-l .h-time{font-size:15px;min-width:72px;text-align:right;}body.ori-l .onair-badge{padding:2px 7px;font-size:9px;}body.ori-l .test-badge{font-size:9px;}
  /* ●LIVEと番組タイトルバー：コンパクト表示 */
  body.ori-l .viewing-bar{
    height:34px;
    min-height:34px;
    padding:0 8px;
    align-items:center;
  }body.ori-l #viewing-title{font-size:11px;}
  /* プレイヤー：高さ固定・幅はgridが決める */
  body.ori-l .player-wrap{
    padding-bottom:0 !important;
    height:calc(100vh - var(--hdrL) - 34px - 34px - 6px);
  }
  /* 横向きの#yt-player-apiは上書きせず、基本定義(env相殺)に委ねる（ズレ打ち消しを効かせるため） */
  /* コントロールバー：コンパクト */
  body.ori-l .custom-ctrl{height:34px;padding:0 8px;gap:5px;}body.ori-l .custom-ctrl .expand-open-btn{margin-left:-3px;width:30px;height:30px;}body.ori-l .ctrl-btn{min-width:28px;height:28px;}
  /* 番組表：グリッドの番組表エリアに収める（内側のsb-listだけスクロール） */
  body.ori-l .sidebar{
    height:100%;
    min-height:0;
    max-height:100%;
    overflow:hidden;
  }
  /* 番組表を圧縮して横向きでも多く表示 */
  body.ori-l .sb-head{padding:6px 12px;}
  /* 見出し帯の補足文（出典・操作案内）は横向きでは非表示（2026-08-09指示） */
  body.ori-l .sb-note{display:none;}body.ori-l .time-bar{padding:2px 10px 2px;}body.ori-l .pinfo{padding:3px 10px 5px;gap:2px;}body.ori-l .pname{font-size:11px;line-height:1.3;}

@media(pointer:coarse) and (orientation:portrait) and (min-width:600px){

     safe-area-inset-topが取得できない場合は固定24pxを使用 */

.sponsor-banner{

/* ★②バナーは「見えている領域」の幅が正確に --banner-w（=縦の動画ウインドウ幅）になる構造。

.sponsor-img{position:relative;width:var(--banner-w);max-width:100%;aspect-ratio:2277 / 193.2;overflow:hidden;border-radius:6px;line-height:0;}

<script>
// ══════════════════════════════════════════════
//  スポンサー定義（仮データ・将来スプレッドシート化）
// ══════════════════════════════════════════════
// 各社のテーマ色に合わせた仮バナー画像（SVG）を生成
function makeBanner(name, tagline, bg, accent, icon){
  var safe=function(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
  // 社名の長さに応じてフォント調整（中央配置・はみ出し防止）
  var nlen=name.length;
  var nameSize = nlen>=12 ? 28 : (nlen>=9 ? 34 : 38);
  return '<svg viewBox="0 0 640 86" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">'
    + '<rect width="640" height="86" fill="'+bg+'"/>'
    + '<rect x="0" y="0" width="12" height="86" fill="'+accent+'"/>'
    + '<circle cx="588" cy="43" r="62" fill="'+accent+'" opacity="0.15"/>'
    + '<circle cx="640" cy="14" r="34" fill="#ffffff" opacity="0.07"/>'
    + '<text x="572" y="56" font-family="sans-serif" font-size="42" text-anchor="middle" opacity="0.9">'+icon+'</text>'
    // 上段左: sponsoredバッジ
    + '<rect x="26" y="11" width="62" height="26" rx="5" fill="#c8992a"/>'
    + '<text x="57" y="30" font-family="-apple-system,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">広告</text>'
    // 上段右: タグライン（sponsoredの右）
    + '<text x="146" y="30" font-family="-apple-system,sans-serif" font-size="19" fill="#ffffff" opacity="0.92">'+safe(tagline)+'</text>'
    // 下段: 社名（中央配置・上段に寄せて縦間隔を短縮）
    + '<text x="320" y="72" font-family="-apple-system,sans-serif" font-size="'+nameSize+'" font-weight="800" fill="#ffffff" text-anchor="middle">'+safe(name)+'</text>'
    + '</svg>';
}

// iPhone縦向き専用: sponsored(左固定)＋[キャッチ＋社名](表示エリア中央)＋アイコン(右)。緑バー相当の高さ・社名は縦幅最大
function makeBannerCompact(name, tagline, bg, accent, icon){
  var safe=function(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
  // 文字幅推定(em): CJK全角=1.0 / 半角空白=0.30 / その他=0.55
  var chW=function(s){var w=0;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);
    if((c>=0x3000&&c<=0x9fff)||(c>=0xff00&&c<=0xffef)) w+=1.0;
    else if(s.charAt(i)===' ') w+=0.30; else w+=0.55;} return w;};
  var cy=30, areaL=106, areaR=674, gap=16, areaW=areaR-areaL; // sponsoredとアイコンの間が表示エリア
  var nlen=name.length;
  var nameFont = nlen>=9 ? 38 : (nlen>=7 ? 42 : 46); // 社名は縦幅いっぱい
  var nEm=chW(name), tEm=chW(tagline);
  var Wn=nEm*nameFont;
  // キャッチは残り幅に収まる最大サイズ（上限22・下限11）
  var catchFont=Math.min(22, Math.floor((areaW-Wn-gap)/Math.max(tEm,0.1)));
  if(catchFont<11) catchFont=11;
  var Wc=tEm*catchFont, groupW=Wc+gap+Wn;
  // それでも収まらなければ社名を縮小して表示エリア内に収める（はみ出し防止）
  while(groupW>areaW && nameFont>26){
    nameFont-=2; Wn=nEm*nameFont;
    catchFont=Math.min(22, Math.floor((areaW-Wn-gap)/Math.max(tEm,0.1)));
    if(catchFont<11) catchFont=11;
    Wc=tEm*catchFont; groupW=Wc+gap+Wn;
  }
  var gStart=(areaL+areaR)/2 - groupW/2;            // [キャッチ＋社名]を表示エリア中央に
  var catchX=gStart, nameX=gStart+Wc+gap;
  var baseC=(cy + catchFont*0.35).toFixed(1);
  var baseN=(cy + nameFont*0.35).toFixed(1);
  return '<svg viewBox="0 0 720 60" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">'
    + '<rect width="720" height="60" fill="'+bg+'"/>'
    + '<rect x="0" y="0" width="9" height="60" fill="'+accent+'"/>'
    + '<circle cx="700" cy="30" r="36" fill="'+accent+'" opacity="0.15"/>'
    // アイコン（右端）
    + '<text x="700" y="41" font-family="sans-serif" font-size="32" text-anchor="middle" opacity="0.9">'+icon+'</text>'
    // sponsoredバッジ（左・位置そのまま）
    + '<rect x="14" y="18" width="52" height="24" rx="4" fill="#c8992a"/>'
    + '<text x="40" y="36" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">広告</text>'
    // キャッチフレーズ（中央グループ・左寄せ開始）
    + '<text x="'+catchX.toFixed(1)+'" y="'+baseC+'" font-family="-apple-system,sans-serif" font-size="'+catchFont+'" fill="#ffffff" opacity="0.92">'+safe(tagline)+'</text>'
    // 社名（中央グループ・縦幅最大）
    + '<text x="'+nameX.toFixed(1)+'" y="'+baseN+'" font-family="-apple-system,sans-serif" font-size="'+nameFont+'" font-weight="800" fill="#ffffff">'+safe(name)+'</text>'
    + '</svg>';
}

// 画像バナーをHTMLに（縦=bannerC/横=banner）。?v=でキャッシュ更新
function imgBanner(src){return '<img src="'+src+'?v=129" alt="" style="display:block;border:0">';}
// ══════════════════════════════════════════════
//  宍粟市お知らせ・イベント（番組表の下の枠）
//  表示の優先順位（2026-08-09ユーザー承認）:
//   ①気象庁の警報(発表中のみ・最優先) → ②市公式サイトの新着(city_news.json=GitHub Actionsが30分毎に自動転記)
//   → ③サンプル(②が読めない時のみ)。
//  ※観光協会(しそうツーリズムガイド)の情報は「不要」の指示により廃止:
//    旧・観光協会RSS→Firestore中継(scripts/fetch-city-news.mjs+毎時Actions)は撤去、
//    Firestore(broadcast/city_news)の読み込み(loadCityNews)も停止（関数は残置・手動お知らせを再開したい時に復活可）。
// ══════════════════════════════════════════════
var CITY_NEWS=[
  {type:'event',  title:'（サンプル）シソイチライドイベント2026', date:'2026.02.20'},
  {type:'notice', title:'（サンプル）ここに市からのお知らせが表示されます', date:''}
];
var cityNewsIndex=0, _cityNewsReal=false, _cityNewsSig='', _cityNewsSrc='';
var CIVIC_NEWS=[], _civicSig='';   // 市公式サイトの新着（くらし/イベント/募集/重要）
var JMA_WARN=[], _jmaSig='';       // 発表中の気象警報（宍粟市・優先表示）
// いま表示すべきリスト（優先順位を一元化）
function newsDisplayList(){

//  番組定義
// ══════════════════════════════════════════════
// 番組表はFirestoreで一元管理し、コード側に固定番組表は持たない（番組変更時にコードを触らないため）。
// 起動時は前回正常取得できたキャッシュから復元。無ければ空＝「読み込み中」表示のまま取得を待つ。
var S=6,E=24,CM=120;
var CYCLE=[];
(function initScheduleFromCache(){
  try{
    var c=JSON.parse(localStorage.getItem('shisochan_schedule_cache_v2')||'null');
    if(c&&c.data&&validSchedule(c.data)===''){
      CYCLE=c.data.cycle;
      if(c.data.airStart!=null)S=c.data.airStart;
      if(c.data.airEnd!=null)E=c.data.airEnd;
      if(c.data.cycleMinutes!=null)CM=c.data.cycleMinutes;
    }
  }catch(_){}
})();
var NC=(E-S)*60/CM;
var CS=[];for(var i=0;i<NC;i++)CS.push(S*60+i*CM);
var CO=[];var _a=0;for(var i=0;i<CYCLE.length;i++){CO.push(_a);_a+=CYCLE[i].dur;}

// ══════════════════════════════════════════════
//  Firestoreからの番組表取得（Step1: 番組表の外部化）
//  下の2つの値を手順書に従って貼り付けると有効になる。
//  空のままなら従来どおり内蔵番組表で動作（動作は完全に同一）。
//  取得失敗・データ不正時も内蔵番組表に自動フォールバックし放送は止まらない。
// ══════════════════════════════════════════════
var FIREBASE={
  projectId:'shisochan-net',  // ← 手順書で取得した「プロジェクトID」を''の間に貼る
  apiKey:'AIzaSyCrgNeYr8vLUHzEJMFIgSDm-WheRCPVS3Q'      // ← 手順書で取得した「ウェブAPIキー」を''の間に貼る
};

// Firestore RESTの型付き値 → 素のJS値
function fsVal(v){
  if(v==null)return null;
  if('stringValue' in v)return v.stringValue;
  if('integerValue' in v)return parseInt(v.integerValue,10);
  if('doubleValue' in v)return v.doubleValue;
  if('booleanValue' in v)return v.booleanValue;
  if('nullValue' in v)return null;
  if('timestampValue' in v)return v.timestampValue;
  if('mapValue' in v){var o={},f=(v.mapValue&&v.mapValue.fields)||{};for(var k in f)o[k]=fsVal(f[k]);return o;}
  if('arrayValue' in v){var a=(v.arrayValue&&v.arrayValue.values)||[];var r=[];for(var i=0;i<a.length;i++)r.push(fsVal(a[i]));return r;}
  return null;
}

// 番組表データの検証。問題なければ''、問題があれば理由を返す
function validSchedule(d){
  if(!d||Object.prototype.toString.call(d.cycle)!=='[object Array]'||d.cycle.length<1)return '番組リストが空か形式不正';
  var s=(d.airStart!=null?d.airStart:S),e=(d.airEnd!=null?d.airEnd:E),cm=(d.cycleMinutes!=null?d.cycleMinutes:CM);
  if(typeof s!=='number'||typeof e!=='number'||typeof cm!=='number'||s>=e||cm<=0)return '放送時間の設定が不正';
  if(((e-s)*60)%cm!==0)return '放送時間('+((e-s)*60)+'分)がサイクル('+cm+'分)で割り切れない';
  var tot=0;
  for(var i=0;i<d.cycle.length;i++){
    var p=d.cycle[i];
    if(!p||typeof p.ytId!=='string'||!p.ytId||typeof p.title!=='string'||!p.title||typeof p.cat!=='string'||typeof p.dur!=='number'||p.dur<=0)return (i+1)+'番目の番組データが不正';
    tot+=p.dur;
  }
  if(tot!==cm)return '番組の合計尺('+tot+'分)がサイクル('+cm+'分)と不一致';
  return '';
}

// 検証済みデータを適用して番組表を再構築（放送中なら現在番組に同期し直す）
function applySchedule(d){
  CYCLE=d.cycle;
  if(d.airStart!=null)S=d.airStart;
  if(d.airEnd!=null)E=d.airEnd;
  if(d.cycleMinutes!=null)CM=d.cycleMinutes;
  NC=(E-S)*60/CM;
  CS=[];for(var i=0;i<NC;i++)CS.push(S*60+i*CM);
  CO=[];var a=0;for(var j=0;j<CYCLE.length;j++){CO.push(a);a+=CYCLE[j].dur;}
  try{renderSB();}catch(_){}
  scheduleFailed=false; try{showLoadErr('hide');}catch(_){}
  // 視聴意思がある場合は現在番組へ同期。番組表が未取得のまま放送開始→off-air表示になっていた時も、
  // 番組表が届いた時点で放送時間内なら再生へ復帰する（isOffを解除）。
  if(userWantsPlay&&!isManual){var pos=nowPos();if(pos){isOff=false;playSchedule(pos.c,pos.p);}}
}

// 番組表の読み込み中/失敗オーバーレイ表示（映像エリア）。state: 'loading'|'error'|'hide'
var scheduleFailed=false;
function showLoadErr(state){
  var ov=document.getElementById('loaderr-ov'); if(!ov)return;
  if(state==='hide'){ ov.style.display='none'; return; }

// 番組表の内容シグネチャ（同一データの無駄な再適用＝再生の巻き戻しを防ぐための比較用）
function schedSig(d){
  var s=d.airStart+'|'+d.airEnd+'|'+d.cycleMinutes+'|';
  for(var i=0;i<d.cycle.length;i++){var p=d.cycle[i];s+=p.ytId+':'+p.dur+':'+p.title+':'+p.cat+':'+(p.telop||'')+';';}
  return s;
}
// 取得本体（stale-while-revalidate）：キャッシュがあれば即描画し、必ずサーバーの最新も取得して
// 変わっていればその場で差し替える。→ 番組表の更新が当日中に全端末へ反映される（旧: 1日1回取得だと当日反映されない不具合を修正）。
// 番組表は常にFirestoreが正。コード側に固定番組表は持たない。
function loadRemoteSchedule(){
  if(!FIREBASE.projectId||!FIREBASE.apiKey)return; // 未設定なら何もしない
  var KEY='shisochan_schedule_cache_v2'; // v2: 「1日1回」キャッシュを廃し常に最新確認する設計へ（旧v1キャッシュは無視される）
  var cached=null;
  try{cached=JSON.parse(localStorage.getItem(KEY)||'null');}catch(_){}
  var appliedSig=''; // 現在アプリに適用済みの番組表のシグネチャ（空=未適用）
  // 1) キャッシュがあれば即描画（高速表示＋オフライン耐性）。ただし必ず最新を取りに行く。
  if(cached&&cached.data&&validSchedule(cached.data)===''){
    applySchedule(cached.data);
    appliedSig=schedSig(cached.data);
  }
  var url='https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(FIREBASE.projectId)+'/databases/(default)/documents/broadcast/schedule?key='+encodeURIComponent(FIREBASE.apiKey);
  var attempt=0, MAX=4;
  function useCacheOrWait(){
    // 取得失敗時：既にキャッシュを適用済みならそのまま継続（オフライン等）。無ければ読み込み中のまま自動再試行。
    if(appliedSig) return;
    scheduleFailed=true; try{renderSB();}catch(_){}  try{showLoadErr('error');}catch(_){}
    setTimeout(function(){ scheduleFailed=false; try{showLoadErr('loading');}catch(_){} attempt=0; tryFetch(); }, 15000);
  }
  function tryFetch(){
    attempt++;
    fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(doc){
      var d={},f=doc.fields||{};for(var k in f)d[k]=fsVal(f[k]);
      var err=validSchedule(d);
      if(err){console.warn('[番組表] データ不正: '+err);throw new Error('invalid-data');}
      try{localStorage.setItem(KEY,JSON.stringify({data:d}));}catch(_){}
      var sig=schedSig(d);
      if(sig!==appliedSig){ applySchedule(d); appliedSig=sig; } // 変わった時だけ差し替え（無駄な再生切替を防ぐ）
    })
    .catch(function(e){
      console.warn('[番組表] 取得失敗('+e.message+') 試行'+attempt+'/'+MAX);
      if(attempt<MAX){ setTimeout(tryFetch, attempt*2000); } // 2s,4s,6s とリトライ
      else { useCacheOrWait(); }
    });
  }
  tryFetch();
}

// ══════════════════════════════════════════════
//  視聴計測（アナリティクス）v1.14
//  ・1視聴＝1番組セッションで実再生が累計30秒に達した時に1回だけ
//  ・端末はランダムUUIDのみで識別（個人情報ゼロ）
//  ・イベントはローカルに集約し、10分毎＋離脱時にまとめて送信（書込最小化）
//  ・全処理はtry/catchで隔離。計測が失敗しても再生には一切影響しない
//  ・FIREBASE未設定時は完全に何もしない
// ══════════════════════════════════════════════
var _stQKEY='shisochan_stats_queue_v1';
var _stDevKEY='shisochan_device_id';
var _stPingKEY='shisochan_dev_ping';
var _stSes={id:'',playing:false,t0:0,acc:0,sent:0,counted:false}; // 番組セッション
var _stImpLast={idx:-1,ts:0};
var _stFlushing=false;
function _stEnabled(){return !!(FIREBASE.projectId&&FIREBASE.apiKey);}
function _stDay(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function _stDevId(){
  var id='';
  try{id=localStorage.getItem(_stDevKEY)||'';}catch(_){}
  if(!id){
    try{id=(crypto&&crypto.randomUUID)?crypto.randomUUID():'';}catch(_){}
    if(!id){id='d';for(var i=0;i<24;i++)id+='abcdefghijklmnopqrstuvwxyz0123456789'.charAt(Math.floor(Math.random()*36));}
    try{localStorage.setItem(_stDevKEY,id);}catch(_){}
  }
  return id;
}
function _stQ(){ // キュー取得（壊れていたら初期化）
  var q=null;
  try{q=JSON.parse(localStorage.getItem(_stQKEY)||'null');}catch(_){}
  if(!q||typeof q!=='object')q={v:{},s:{},hours:{},imp:{},clk:{},titles:{}};
  q.v=q.v||{};q.s=q.s||{};q.hours=q.hours||{};q.imp=q.imp||{};q.clk=q.clk||{};q.titles=q.titles||{};
  return q;
}
function _stQSave(q){try{localStorage.setItem(_stQKEY,JSON.stringify(q));}catch(_){}}
function _stTitleOf(ytId){for(var i=0;i<CYCLE.length;i++)if(CYCLE[i].ytId===ytId)return CYCLE[i].title;return '';}
// 再生秒の締め（playing中なら現在までを加算）
function _stCloseSeg(){
  if(_stSes.playing){_stSes.acc+=(Date.now()-_stSes.t0)/1000;_stSes.playing=false;}
}
// 30秒到達チェック（1セッション1回のみ）
function _stCheckView(){
  if(_stSes.counted||!_stSes.id||_stSes.acc<30)return;
  _stSes.counted=true;
  var q=_stQ();
  q.v[_stSes.id]=(q.v[_stSes.id]||0)+1;
  var h='h'+new Date().getHours();
  q.hours[h]=(q.hours[h]||0)+1;
  var t=_stTitleOf(_stSes.id);if(t)q.titles[_stSes.id]=t;
  _stQSave(q);
}
// 確定済み秒数をキューへ（差分方式・多重計上なし）
function _stCommitSecs(){
  var d=Math.floor(_stSes.acc-_stSes.sent);
  if(d<=0||!_stSes.id)return;
  var q=_stQ();
  q.s[_stSes.id]=(q.s[_stSes.id]||0)+d;
  _stQSave(q);
  _stSes.sent+=d;
}
// ── フック用の公開関数（各既存関数から1行で呼ばれる）──
function statsSessionStart(ytId){
  if(!_stEnabled())return;
  if(_stSes.id===ytId)return; // forceResync等の同一番組再ロードはセッション継続
  statsSessionEnd();
  _stSes={id:ytId,playing:false,t0:0,acc:0,sent:0,counted:false};
}
function statsSessionEnd(){
  if(!_stEnabled()||!_stSes.id)return;
  _stCloseSeg();_stCheckView();_stCommitSecs();
  _stSes={id:'',playing:false,t0:0,acc:0,sent:0,counted:false};
}
function statsOnState(st){
  if(!_stEnabled()||!_stSes.id)return;
  if(st===1){ if(!_stSes.playing){_stSes.playing=true;_stSes.t0=Date.now();} }
  else{ _stCloseSeg();_stCheckView();_stCommitSecs(); }
}
function statsBannerImp(name){
  if(!_stEnabled())return;
  // 見えていない表示は数えない：電源画面中・タブ非表示中は除外
  var ps=document.getElementById('power-screen');
  if(ps&&ps.style.display!=='none')return;
  if(document.hidden)return;
  // resize連打等での水増し防止：同一スポンサーは9秒以内の再注入をノーカウント
  var now=Date.now();
  if(_stImpLast.idx===sponsorIndex&&now-_stImpLast.ts<9000)return;
  _stImpLast={idx:sponsorIndex,ts:now};
  var q=_stQ();q.imp[name]=(q.imp[name]||0)+1;_stQSave(q);
}
function statsBannerClick(name){
  if(!_stEnabled())return;
  var q=_stQ();q.clk[name]=(q.clk[name]||0)+1;_stQSave(q);
}
// Firestoreのフィールドパス用（数字始まり・記号・日本語もバッククォートで安全に）
function _stFP(seg){return '`'+String(seg).replace(/\\/g,'\\\\').replace(/`/g,'\\`')+'`';}
// commit リクエストJSONを組み立て（テスト可能な純関数）
function statsBuildCommit(q,day,devId,pingNeeded){
  var docBase='projects/'+FIREBASE.projectId+'/databases/(default)/documents/';
  var writes=[];var k;
  // stats_daily/{day}: 全カウンタをincrementで
  var tf=[];
  for(k in q.v)tf.push({fieldPath:'programs.'+_stFP(k)+'.v',increment:{integerValue:String(q.v[k])}});
  for(k in q.s)tf.push({fieldPath:'programs.'+_stFP(k)+'.s',increment:{integerValue:String(q.s[k])}});
  for(k in q.hours)tf.push({fieldPath:'hours.'+_stFP(k),increment:{integerValue:String(q.hours[k])}});
  for(k in q.imp)tf.push({fieldPath:'banners.'+_stFP(k)+'.imp',increment:{integerValue:String(q.imp[k])}});
  for(k in q.clk)tf.push({fieldPath:'banners.'+_stFP(k)+'.clk',increment:{integerValue:String(q.clk[k])}});
  if(tf.length){
    writes.push({update:{name:docBase+'stats_daily/'+day,fields:{d:{stringValue:day}}},
                 updateMask:{fieldPaths:['d']},updateTransforms:tf});
  }
  // stats_programs/{ytId}: 累計views/seconds + title
  var ids={};for(k in q.v)ids[k]=1;for(k in q.s)ids[k]=1;
  for(k in ids){
    var tr=[];
    if(q.v[k])tr.push({fieldPath:'views',increment:{integerValue:String(q.v[k])}});
    if(q.s[k])tr.push({fieldPath:'seconds',increment:{integerValue:String(q.s[k])}});
    var fields={},mask=[];
    if(q.titles[k]){fields.title={stringValue:q.titles[k]};mask.push('title');}
    else{fields.d={stringValue:day};mask.push('d');}
    writes.push({update:{name:docBase+'stats_programs/'+k,fields:fields},
                 updateMask:{fieldPaths:mask},updateTransforms:tr});
  }
  // stats_devices/{uuid}: 1日1回だけlastSeen更新（DAU用）
  if(pingNeeded){
    writes.push({update:{name:docBase+'stats_devices/'+devId,fields:{lastSeen:{stringValue:day}}},
                 updateMask:{fieldPaths:['lastSeen']},
                 updateTransforms:[{fieldPath:'daysSeen',increment:{integerValue:'1'}}]});
  }
  return writes.length?{writes:writes}:null;
}
function statsFlush(useBeacon){
  if(!_stEnabled()||_stFlushing)return;
  try{
    // 再生中でも計時を止めずに現時点までを確定（スナップショット）
    if(_stSes.playing){_stSes.acc+=(Date.now()-_stSes.t0)/1000;_stSes.t0=Date.now();}
    _stCheckView();_stCommitSecs();
    var q=_stQ();var day=_stDay();var dev=_stDevId();
    var ping=false;
    try{ping=(localStorage.getItem(_stPingKEY)!==day);}catch(_){ping=true;}
    var body=statsBuildCommit(q,day,dev,ping);
    if(!body)return;
    var url='https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(FIREBASE.projectId)+'/databases/(default)/documents:commit?key='+encodeURIComponent(FIREBASE.apiKey);
    var json=JSON.stringify(body);
    var sent=false;
    if(useBeacon&&navigator.sendBeacon){
      try{sent=navigator.sendBeacon(url,new Blob([json],{type:'application/json'}));}catch(_){sent=false;}
      if(sent){ _stQSave({v:{},s:{},hours:{},imp:{},clk:{},titles:{}}); try{localStorage.setItem(_stPingKEY,day);}catch(_){}}
      return;
    }
    _stFlushing=true;
    fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:json,keepalive:!!useBeacon})
    .then(function(r){
      _stFlushing=false;
      if(r.ok){ _stQSave({v:{},s:{},hours:{},imp:{},clk:{},titles:{}}); try{localStorage.setItem(_stPingKEY,day);}catch(_){}}
    })
    .catch(function(){_stFlushing=false;}); // 失敗時はキュー保持→次回再送
  }catch(_){_stFlushing=false;}
}
function statsInit(){
  if(!_stEnabled())return;
  try{
    _stDevId();
    setInterval(function(){try{statsFlush(false);}catch(_){}},600000); // 10分毎
    document.addEventListener('visibilitychange',function(){if(document.hidden){try{statsSessionEnd();statsFlush(true);}catch(_){}}});
    window.addEventListener('pagehide',function(){try{statsSessionEnd();statsFlush(true);}catch(_){}});
  }catch(_){}
}

var f2=function(n){return String(n).padStart(2,'0');};
var hm=function(m){return f2(Math.floor(m/60))+':'+f2(m%60);};
var nowF=function(){var d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;};
var inAir=function(){var n=nowF();return n>=S*60&&n<E*60;};

function nowPos(){
  if(!CYCLE.length)return null; // 番組表未取得（読み込み中）は現在番組なし扱い
  if(!inAir())return null;
  var n=nowF();
  for(var c=NC-1;c>=0;c--){
    if(n>=CS[c]){
      var off=n-CS[c],p=0;
      for(var i=CYCLE.length-1;i>=0;i--){if(CO[i]<=off){p=i;break;}}
      return{c:c,p:p};
    }
  }
  return null;
}
var smOf=function(c,p){return CS[c]+CO[p];};
var emOf=function(c,p){return smOf(c,p)+CYCLE[p].dur;};
var esOf=function(c,p){return Math.max(0,Math.floor((nowF()-smOf(c,p))*60));};
var nxtOf=function(c,p){
  if(p<CYCLE.length-1)return{c:c,p:p+1};
  if(c<NC-1)return{c:c+1,p:0};
  return null;
};
var allT=function(pIdx){var r=[];for(var i=0;i<CS.length;i++)r.push(CS[i]+CO[pIdx]);return r;};

var ytInitialized=false;
function onYouTubeIframeAPIReady(){
  if(ytInitialized)return; // キャッシュ等による二重呼び出しを防止
  ytInitialized=true;
  ytPlayer=new YT.Player('yt-player-api',{
    width:_fitW0,height:_fitH0,
    playerVars:{autoplay:0,playsinline:1,rel:0,modestbranding:1,fs:0,controls:0,disablekb:1,cc_load_policy:0},
    events:{
      onStateChange:function(e){
        var st=e.data;
        try{statsOnState(st);}catch(_){}
        if(st===1||st===5){ killCaptions(); } // 再生開始/キュー時に字幕を無効化
        // 再生開始でスピナー・終了画面を消す（バッファ中=3は消さない、実際に再生=1のみ）
        var _isPlay=(st===1||st===3);
        (function(){
          var _pp='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
          var _pl='<path d="M8 5v14l11-7z"/>';
          var _ic=document.getElementById('ctrl-play-icon');
          var _fi=document.getElementById('fs-play-icon');
          if(_ic)_ic.innerHTML=_isPlay?_pp:_pl;
          if(_fi)_fi.innerHTML=_isPlay?_pp:_pl;
        })();
        if(st===1){ clearSpinnerTimer();if(!isOff){showEnded(false);}showSpinner(false); }
        if(st===3&&!isOff){ showEnded(false); } // バッファ中は終了画面だけ消す
        // iOS: st=5(cued)でスピナーを消す（cueVideoById後は自動再生されないため）
        if(st===5&&isIOS){ clearSpinnerTimer();showSpinner(false); }
        // 動画終了
        if(st===0&&!isOff&&_endSwitchOK()){ showSpinner(true,'切り替え中...'); onEnded(); }
        // Now Playingインジケーター抑制（Dynamic Island非表示の試み）
        if('mediaSession' in navigator){
          navigator.mediaSession.playbackState='none';
        }
      },
      onReady:function(e){
        ytReady=true;ytPlayer=e.target;
        armStartBtn();   // API準備完了 → 放送開始ボタンを有効化
        killCaptions();  // 字幕を無効化
        try{ fitPlayer(); }catch(_){} // ★動画ロード前に内部サイズを1920x1080へ固定（回転ズレ根治の肝）
        if(pendingYtId){
          var id=pendingYtId,sec=pendingSec;
          pendingYtId='';pendingSec=0;
          e.target.loadVideoById({videoId:id,startSeconds:sec});
          try{ e.target.playVideo(); }catch(_){} // 遅延ロード時も再生を試みる
          clearSpinnerTimer();
          spinnerTimer=setTimeout(function(){showSpinner(false);},60000);
          setTimeout(killCaptions,600); // ロード後に再度字幕を無効化
        }else{
          showSpinner(false);
        }
      }
    }
  });
}

var isExpanded=false,fsUiTimer=null;

// ── プレイヤーのフィット（根治方式） ──
// iOSではYouTubeが「動画を読み込んだ時のiframeサイズ」でレイアウトを固定し、回転しても
// 作り直さない（縦で再生→横でズレる、が実機確定）。→ iframeの"内部サイズ"を常に
// 固定(1920×1080=16:9)にしておけば、YouTubeは最初から横向き基準で一度だけレイアウトし、
// 以後どの向き・回転でも作り直し不要＝ズレない。表示はCSS transformで枠に合わせる。
// ★内部サイズの固定は枠が非表示(サイズ0)でも必ず行う＝動画ロード前に確定させるのが肝。
// 副次効果: YouTubeのUIも1920枠基準で描かれ縮小表示になり目立たない。将来4K素材なら3840×2160に。
var _fitW0=1920,_fitH0=1080;
function fitPlayer(){
  var yt=document.getElementById('yt-player-api');
  if(!yt) return;
  var pw=document.getElementById('player-wrap');
  if(!pw){ return; }
  var cw=pw.clientWidth, ch=pw.clientHeight;
  var isFs=pw.classList.contains('expanded');
  try{ if(!isFs && (pw.matches(':fullscreen')||pw.matches(':-webkit-full-screen'))) isFs=true; }catch(_){}

  if(!isFs){
    // ★通常表示は v1.41以前の「枠を100%そのまま埋める」素直方式に復帰（transform非使用）。
    //   v1.42で導入したtransform縮小方式が、iOSで映像を数pxズラす原因だった（回帰）。
    //   枠(player-wrap)は縦横どちらでも常に16:9なので、iframeを100%で埋めれば
    //   YouTubeがそのまま16:9で描く＝拡大縮小の合成ズレが起きない（昔の安定挙動）。
    yt.style.position='absolute';
    // ★サイズ・位置はCSS側(#yt-player-apiのenv相殺)に委ねる。env()はCSSで確実に解決するため、
    //   viewport-fit=cover時のYouTube映像寄せをピタリ相殺できる。インライン指定はクリアしてCSSを効かせる。
    yt.style.left=''; yt.style.top=''; yt.style.right=''; yt.style.bottom='';
    yt.style.width=''; yt.style.height='';
    yt.style.transform='none'; yt.style.transformOrigin='0 0';
    if(cw>0){
      var fsb0=document.getElementById('fs-ctrl-bar');
      if(fsb0){ fsb0.style.width=Math.max(280,Math.round(cw*0.94))+'px'; }
      var tel0=document.getElementById('video-telop');
      if(tel0){ tel0.style.bottom='12px'; try{ fitTelop(cw); }catch(_){} }
    }
    return;
  }

  // ── 全画面：枠が16:9でないため、iframe内部1920×1080固定+transformで縮小フィット ──
  yt.style.position='absolute'; yt.style.left='0'; yt.style.top='0';
  yt.style.right='auto'; yt.style.bottom='auto';
  yt.style.width=_fitW0+'px'; yt.style.height=_fitH0+'px';
  yt.style.transformOrigin='0 0';
  if(cw<=0||ch<=0){ yt.style.transform='scale(0)'; return; }
  // 全画面・横向きのみ、上部にバナー用の帯を確保（動画を少し縮小して下げる。下部はそのまま）
  var topBand=0;
  if(window.matchMedia('(orientation:landscape)').matches){
    var _fss=document.getElementById('fs-sponsor');
    topBand=(_fss && _fss.offsetHeight>8 ? _fss.offsetHeight : 36) + 8;
  }
  var availH=ch-topBand;
  var scale=Math.min(cw/_fitW0, availH/_fitH0); // contain（全体表示・レターボックス）
  // 平行移動は整数pxにスナップ（iOSのサブピクセル描画による微オフセット/にじみを防ぐ）
  var tx=Math.round((cw-_fitW0*scale)/2), ty=Math.round(topBand + (availH-_fitH0*scale)/2);
  yt.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
  // 全画面のフローティング操作バーの幅を「映像の横幅より少し短く」動的設定
  var vw=Math.round(_fitW0*scale); // 表示中の映像の横幅
  var fsb=document.getElementById('fs-ctrl-bar');
  if(fsb){ fsb.style.width=Math.max(280,Math.round(vw*0.94))+'px'; }
  // 出典テロップを「映像の下部」に合わせ、1行で動画幅に収まるようフォントを自動調整
  var tel=document.getElementById('video-telop');
  if(tel){ tel.style.bottom=(ch-(ty+Math.round(_fitH0*scale))+12)+'px'; try{ fitTelop(vw); }catch(_){} }
}

  var _spTop=null,_spLeft=null;

  //   位置が確定するまで非表示にし、確定後(180ms)にすっと表示する（ガタつき除去・2026-08-08ユーザー指示）
  var _fsSp=document.getElementById('fs-sponsor');
  if(_fsSp){ _fsSp.style.transition='none'; _fsSp.style.opacity='0'; }
  // ★⓪映像もcover再レイアウトの横ガタつきを見せないため、位置確定後に表示（バナーと同方式）
  var _ytFade=document.getElementById('yt-player-api');
  if(_ytFade){ _ytFade.style.transition='none'; _ytFade.style.opacity='0'; }
  wrap.classList.add('expanded');
  document.body.classList.add('fs-open');
  // ★全画面中はルート(html)背景も黒に：帯色の採取元候補(html/body)を全て黒に揃える。
  document.documentElement.style.background='#000';

  //   cover無しでは、iOSは上部帯を「起動時の色で固定した不透明バー」としてページの上に描き、ページ側から二度と変更できない
  //   (黒オーバーレイ/body・html・header黒/スクロール/coverパルス＝全て無効と実機環境で証明)。
  //   cover有りでは帯が消えてページの色がそのまま見える(=黒い全画面が透ける=帯黒✓)。coverを外すと帯は即・元の緑に戻る(実証済み)。
  //   よって「全画面中だけcover ON」が唯一の正解。通常時はcover無し=映像ズレは起きない(v1.79-83時代の実機で実証済み)。
  (function(){ var vp=document.querySelector('meta[name="viewport"]');
    if(vp) vp.setAttribute('content','width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'); })();

  if(!wrap._touchHandler){

    wrap.addEventListener('touchstart',wrap._touchHandler,{passive:true});
  }
  showFsUi();
  // 全画面化でサイズが変わるため、YouTube内部を再レイアウト（映像の横ズレ対策）
  scheduleRelayout();
  // 位置確定後に表示（cover再レイアウトのガタつきを見せない）。バナーを実測座標へ固定→fitPlayer→表示の順
  setTimeout(function(){
    if(!isExpanded) return;   // 既に解除されていたら何もしない（closeExpandが復元する）
    // ★バナーを通常時の実測座標へ固定。cover適用で座標系が安全領域ぶん「左」と「上」の両方向へ広がるため、
    //   横位置=「実測left + env(safe-area-inset-left)」・縦位置=「実測top + env(safe-area-inset-top)」で補正。
    //   （縦向き全画面はenv-top=62px：v2.09で上補正が無くバナーが上部黒帯の裏に隠れて消えた＝その根治）
    if(_fsSp && _spTop!==null){
      var envL=0,envT=0;
      try{ var p=document.createElement('div');
        p.style.cssText='position:fixed;visibility:hidden;pointer-events:none;padding-left:env(safe-area-inset-left);padding-top:env(safe-area-inset-top);';
        document.body.appendChild(p); var pcs=getComputedStyle(p);
        envL=parseFloat(pcs.paddingLeft)||0; envT=parseFloat(pcs.paddingTop)||0; p.remove(); }catch(_){}
      _fsSp.style.top=(_spTop+envT)+'px';
      _fsSp.style.left=(_spLeft+envL)+'px';
      _fsSp.style.transform='none';
    }
    try{ fitPlayer(); }catch(_){}
    // レイアウトが完全に確定した2フレーム後に0.25秒でふわっと表示（承認済みフェード方式・時間配分のみ調整）
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      if(!isExpanded) return;
      if(_fsSp){ _fsSp.style.transition='opacity .3s ease'; _fsSp.style.opacity='1'; }
      if(_ytFade){ _ytFade.style.transition='opacity .3s ease'; _ytFade.style.opacity='1'; }

}

// ★全画面「中」の回転対応（v2.12）：バナーの固定座標を新しい向きで置き直す。
//   【v2.11の失敗と教訓】全画面中(cover)は横の内部画面幅が750→874に広がり、ヘッダー内バナーを
//   「その場で実測」するとcover中の別レイアウト（874は max-width:840 の文字縮小が外れる等）の座標を
//   拾ってしまい変な位置に固定された。→ 実測に頼らず、**通常表示中に実測して保存した座標
//   （_normBanner）＋ 現在のenv(safe-area)** を使う。これは突入時ピンと完全に同じ式で、
//   縦(6,23.7)+env(0,62)／横(188,6)+env(62,0) が実機で正位置と証明済み。
//   保存が無い向き（通常表示でその向きを一度も見ていない場合）のみ実測にフォールバックする
//   （横向きブロックに文字サイズを明記したためcover中874でも通常と同一レイアウト＝実測も正しくなる）。
var _normBanner={port:null,land:null};
function recordNormBanner(){
  if(isExpanded) return; // 通常表示中の座標だけが「正」
  var si=document.getElementById('sponsor-img');
  if(!si) return;
  var r=si.getBoundingClientRect();
  if(!r || r.height<=0) return;
  _normBanner[(window.innerWidth>window.innerHeight)?'land':'port']={t:r.top,l:r.left};
}
function repinFsSponsor(){
  if(!isExpanded) return;
  var fsSp=document.getElementById('fs-sponsor');
  if(!fsSp) return;
  var envL=0,envT=0;
  try{ var p=document.createElement('div');
    p.style.cssText='position:fixed;visibility:hidden;pointer-events:none;padding-left:env(safe-area-inset-left);padding-top:env(safe-area-inset-top);';
    document.body.appendChild(p); var pcs=getComputedStyle(p);
    envL=parseFloat(pcs.paddingLeft)||0; envT=parseFloat(pcs.paddingTop)||0; p.remove(); }catch(_){}
  var saved=_normBanner[(window.innerWidth>window.innerHeight)?'land':'port'];
  var t,l;
  if(saved){

    t=r.top+Math.min(envT,8); l=r.left;

// ══ 向きの判定をCSSから切り離す（2026-08-10・大改修 第1段階）══
//  iOSはアプリ内ブラウザから戻った際にCSSの向き判定(@media(orientation))を凍結させ、
//  縦なのに横用レイアウト（またはその逆）が適用されたまま戻らなくなる（実機データで確定）。
//  そこで「凍結しない値」だけで向きを決め、htmlとbodyのクラス(ori-p/ori-l)で切り替える。
//   ・screen.orientation … 端末の物理的な向き（凍結しない・実測確認済み）
//   ・screen.width/height … 画面の物理サイズ（回転しても不変＝端末の素性。凍結しない）
//  旧: @media(orientation:portrait) and (max-width:767px) → body.ori-p
//  旧: @media(orientation:landscape) and (max-height:500px) → body.ori-l
function applyOrientationClass(){
  try{
    var S=Math.min(screen.width||0, screen.height||0);   // 画面の短辺＝スマホ判定に使う
    if(!S) return;
    // 凍結しない2つの値を突き合わせ、一致した時だけ採用する（片方が当てにならない環境での取り違え防止）。
    // どちらも得られない場合のみ、従来どおり表示領域の縦横比で判定する。
    var so=null, od=null;
    try{ if(screen.orientation && screen.orientation.type) so=(screen.orientation.type.indexOf('landscape')===0); }catch(_){}
    if(window.outerWidth && window.outerHeight) od=(window.outerWidth>window.outerHeight);
    var land;
    if(so!==null && od!==null) land=(so===od)?so:od;   // 食い違い時は窓の実形状を優先
    else if(od!==null) land=od;
    else if(so!==null) land=so;
    else land=(window.innerWidth>window.innerHeight);
    // スマホ判定：画面の物理短辺（凍結しない）で判定。加えて、PCで窓を細くした場合など
    // 「画面は大きいが表示領域が小さい」ケースは従来どおり表示領域でも判定する（既存挙動を維持）。
    var p = !land && (S<=767 || window.innerWidth<=767);
    var l =  land && (S<=500 || window.innerHeight<=500);
    var de=document.documentElement, b=document.body;
    if(de){ de.classList.toggle('ori-p',p); de.classList.toggle('ori-l',l); }
    if(b){ b.classList.toggle('ori-p',p); b.classList.toggle('ori-l',l); }
  }catch(_){}
}
applyOrientationClass();
window.addEventListener('orientationchange', function(){ applyOrientationClass(); setTimeout(applyOrientationClass,200); setTimeout(applyOrientationClass,600); });
window.addEventListener('resize', applyOrientationClass);
setInterval(applyOrientationClass, 500);   // 凍結からの復帰も含め常に正しい向きへ追従

// ══ ビューポート凍結の検知と復旧（2026-08-10・実機の生データで機構を確定）══
//  【実機で確定した凍結の3形態】(?debug=1の実測)
//   ①縦→縦: WIN 402x682(正常812)・safe-area全て0(正常は上62) …高さと安全領域が凍結
//   ②縦→横: 描画幅402のまま(画面874) …幅が凍結
//   ③横→縦: WIN 402x402・CSS判定=LANDなのに端末は縦 …向き判定が凍結
//  【凍結しない値】outerWidth/outerHeight と screen.orientation（全形態で正しい＝判定の土台）
//  【判定に安全領域を含む値を使ってはいけない】横向きは inner幅750 と outer幅874 が
//   安全領域(左右62)ぶん常に異なる＝単純比較は正常時も誤検知する（実測で判明・要注意）。
//   よって安全領域の影響を受けない軸だけで比較する：縦向き=幅どうし／横向き=高さどうし。
//  【復旧手段】ページ側から凍結を解く方法は存在しない（実機で全滅）。唯一確実なのは文書の作り直し。
var _vpSaTop0=null;   // 起動時(必ず健全)の縦向きsafe-area上端。以後0になったら凍結の証拠
var _vpBadTicks=0;
function _vpSaTop(){
  try{
    var p=document.getElementById('__vp_sa');
    if(!p){ p=document.createElement('div'); p.id='__vp_sa';
      p.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);';
      document.body.appendChild(p); }
    return parseFloat(getComputedStyle(p).paddingTop)||0;
  }catch(_){ return 0; }
}
function _vpCal(){    // 起動直後の縦向きで1回だけ較正
  if(_vpSaTop0!==null) return;
  if(window.outerWidth>window.outerHeight) return;
  var t=_vpSaTop();
  if(t>0 && t<=120) _vpSaTop0=t;
}
// ★2026-08-10：standalone限定の条件を撤去。実機データ(safe-areaが全て0)から、
//   ユーザーはSafariでも検証しており、そこでは復旧処理が【一度も動いていなかった】ことが判明した。
//   ブラウザ表示でも安全に使える判定＝「端末の物理向き」と「CSSが採用した向き」の食い違いのみを共通ルールとし、
//   寸法の比較はブラウザのバー等で正常時も差が出るためホーム画面アプリ限定にする。
function _vpStandalone(){ return window.navigator.standalone===true; }
function _vpFrozen(){
  if(!isIOS) return false;
  if(isExpanded || document.hidden) return false;
  var ow=window.outerWidth, oh=window.outerHeight;
  if(!ow || !oh) return false;
  var cssLand; try{ cssLand=window.matchMedia('(orientation: landscape)').matches; }catch(_){ return false; }
  var devLand=(ow>oh);
  if(devLand!==cssLand) return true;                            // ③向きの凍結（全環境共通・誤検知しない）
  if(!_vpStandalone()) return false;                            // 以降はホーム画面アプリのみ
  if(!devLand){
    if(Math.abs(window.innerWidth-ow)>2) return true;           // 縦：幅は安全領域の影響を受けない
    if(_vpSaTop0!==null && _vpSaTop()<1) return true;           // ①安全領域が0に凍結
  }else{
    if(Math.abs(window.innerHeight-oh)>2) return true;          // 横：高さは安全領域の影響を受けない
  }
  return false;
}
function _vpWatch(){
  if(!isIOS) return;
  _vpCal();
  if(document.hidden || isExpanded){ _vpBadTicks=0; return; }
  if(!_vpFrozen()){ _vpBadTicks=0; return; }
  _vpBadTicks++;
  if(_vpBadTicks<4) return;      // 1.6秒連続で異常＝回転の過渡状態では作動しない
  _vpBadTicks=0;
  // ★2026-08-10：作り直し(リロード)は【実機で無効】と確定（復旧1回の実測後も凍結YESのまま）。
  //   無駄な再読み込みで再生を止めるだけなので停止。検知(_vpFrozen)は診断表示のために残す。
  if(true) return;
  try{
    if(performance.now()<6000) return;                       // 起動直後は作動しない
    var n=+sessionStorage.getItem('sc_fix_n')||0;
    var last=+sessionStorage.getItem('sc_fix_at')||0;
    if(Date.now()-last<30000) return;                        // 30秒以内の再作動なし
    if(n>=2) return;                                         // 1エピソードで最大2回（無限ループ防止）
    sessionStorage.setItem('sc_fix_n', String(n+1));
    sessionStorage.setItem('sc_fix_at', String(Date.now()));
    sessionStorage.setItem('shiso_resume', (typeof userWantsPlay!=='undefined' && userWantsPlay)?'1':'0');
  }catch(_){ return; }
  location.reload();
}

// 【重要・2026-08-09】ビューポート凍結(iOSアプリ内ブラウザ中に回転して戻ると描画が古い寸法で固まる)への
//   自動補正は【全面撤去】した。理由：シミュレータでは outer/screen.orientation が正しい値を保つのに対し、
//   実機では同じ値も凍結しうるため、それらを信じた自動補正が誤った寸法を固定し、
//   「拡大表示のまま戻らない」「全画面が解除できない」というより重い故障を生んだ（v2.21の実機失敗）。
//   凍結はiOS側の不具合であり、現状ページ側から安全に直す手段が確認できていない。
//   ＝アプリはビューポートに触れない（全画面のcover切替のみ）。凍結時は端末の回転で復帰する。

// ══ 表示領域の高さの凍結を補う（2026-08-10・縦向きのみ）══
//  リンクから戻ると表示領域の高さが古い値（実測682／正常812）で凍り、番組表が短くなって
//  お知らせが上へ上がる（ユーザー報告）。端末の高さ(outerHeight)は凍らないので、
//  「端末の高さ − 上部バーの高さ」で正しい高さを算出して注入する。
//  上部バーの高さは起動直後（必ず健全）に1回だけ実測し、妥当な範囲(0〜120px)でなければ較正しない＝何もしない。
var _barTop=null;
function calibBar(){
  if(_barTop!==null) return;
  if(window.outerWidth>window.outerHeight) return;      // 縦向きでのみ較正
  var d=(window.outerHeight||0)-(window.innerHeight||0);
  if(d>=0 && d<=120) _barTop=d;
}
function fixFrozenHeight(){
  try{
    calibBar();
    var de=document.documentElement;
    if(_barTop===null || (window.outerWidth>window.outerHeight) || !document.body.classList.contains('ori-p')){
      if(de.style.getPropertyValue('--vpH')) de.style.removeProperty('--vpH');
      return;
    }
    var expect=(window.outerHeight||0)-_barTop;
    if(expect<300){ return; }
    if(Math.abs(window.innerHeight-expect)>2){
      if(de.style.getPropertyValue('--vpH')!==expect+'px'){
        de.style.setProperty('--vpH', expect+'px');
        try{ setHdrVar(); }catch(_){}
        try{ fitPlayer(); }catch(_){}
      }
    }else if(de.style.getPropertyValue('--vpH')){
      de.style.removeProperty('--vpH');
      try{ setHdrVar(); }catch(_){}
      try{ fitPlayer(); }catch(_){}
    }
  }catch(_){}
}
setInterval(fixFrozenHeight, 400);

// ══ タップの突き抜け防止（2026-08-10）══
//  全画面の解除ボタンを押すと、ボタンが消えた直後に同じ指のタップが真下の要素
//  （お知らせウインドウ等）へ届き、意図せずリンクへ飛んでしまう（実機で発生）。
//  解除の瞬間から短時間だけ、あらゆるタップを捕捉段階で無効化して根治する。
var _tapBlockUntil=0;
function blockTapThrough(ms){ _tapBlockUntil=Date.now()+(ms||700); }
function isTapBlocked(){ return Date.now()<_tapBlockUntil; }
(function(){
  var kill=function(e){ if(isTapBlocked()){ e.stopPropagation(); if(e.cancelable) e.preventDefault(); } };
  document.addEventListener('click', kill, true);
  document.addEventListener('touchend', kill, true);
})();

function closeExpand(){
  if(!isExpanded)return;
  blockTapThrough(700);   // 解除ボタンのタップが真下の要素へ突き抜けるのを防ぐ
  isExpanded=false;
  clearFsUiTimer();

  // PC：本物の全画面を解除
  var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  if(!isTouch){
    try{
      if(document.fullscreenElement||document.webkitFullscreenElement){
        if(document.exitFullscreen) document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }catch(_){}
    var btn=document.getElementById('expand-close-btn');
    if(btn){btn.style.opacity='0';btn.style.pointerEvents='none';}
    // fs-ctrl-barを非表示
    var fsBar=document.getElementById('fs-ctrl-bar');
    if(fsBar)fsBar.style.display='none';
    // mousemoveリスナー削除
    if(wrap._mmHandler){wrap.removeEventListener('mousemove',wrap._mmHandler);wrap._mmHandler=null;}
    // PC：解除後に再生を維持
    if(!isOff&&ytPlayer&&ytReady){
      setTimeout(function(){
        try{
          if(ytPlayer.getPlayerState()!==YT.PlayerState.PLAYING){
            ytPlayer.playVideo();
          }
        }catch(_){}
      },300);
    }
    return;
  }

  // タッチデバイス：疑似全画面を解除
  var wrap=document.getElementById('player-wrap');
  // ★帯(左右)の黒残り根治＝深緑オーバーレイを「解除より先に」重ねる：
  //   黒(全画面)→緑→通常画面 の一方向切替になり、通常画面の上で緑が点滅して見える構造自体を排除。
  //   1フレーム描画後に外す＝外れた瞬間に帯が緑を採取して深緑に塗り直される(実機確定の機構・物理最速)。
  var _exitOv=document.createElement('div');
  _exitOv.style.cssText='position:fixed;inset:0;background:#1e3a28;z-index:99998;pointer-events:none;';
  document.body.appendChild(_exitOv);
  wrap.classList.remove('expanded');
  document.body.classList.remove('fs-open');
  document.documentElement.style.background='';   // ルート背景を通常(深緑)へ復元
  // ★coverを外して通常表示へ（帯は即・元の緑に戻る=シミュレータ実証済み。通常時cover無し=映像ズレ無し）
  (function(){ var vp=document.querySelector('meta[name="viewport"]');
    if(vp) vp.setAttribute('content','width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'); })();
  // 全画面バナー・映像の表示状態を復元（座標固定/フェード用のインライン指定を全て解除）
  (function(){ var sp=document.getElementById('fs-sponsor');
    if(sp){ sp.style.transition=''; sp.style.opacity=''; sp.style.top=''; sp.style.left=''; sp.style.transform=''; }
    var yt=document.getElementById('yt-player-api');
    if(yt){ yt.style.transition=''; yt.style.opacity=''; } })();
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    try{_exitOv.remove();}catch(_){}
    setThemeColor('#1e3a28');
  }); });
  // fs-ctrl-barを非表示
  var fsBarT=document.getElementById('fs-ctrl-bar');
  if(fsBarT)fsBarT.style.display='none';
  // touchHandlerを削除
  if(wrap._touchHandler){wrap.removeEventListener('touchstart',wrap._touchHandler);wrap._touchHandler=null;}
  // タッチデバイス：解除後に再生を維持
  if(!isOff&&ytPlayer&&ytReady){
    setTimeout(function(){
      try{
        if(ytPlayer.getPlayerState()!==YT.PlayerState.PLAYING){
          ytPlayer.playVideo();
        }
      }catch(_){}
    },200);
  }
  // 全画面解除でサイズが戻るため、YouTube内部を再レイアウト
  scheduleRelayout();
  // ★全画面中に画面を回転してから解除すると、ヘッダーの実高(--hdr-h)が回転前の向きの値のまま残り、
  //   本文(動画〜お知らせ)が上へズレる。解除後にレイアウトが落ち着いてから測り直す（2026-08-09指摘）。
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ setHdrVar(); try{ fitPlayer(); }catch(_){} }); });
  setTimeout(function(){ setHdrVar(); try{ fitPlayer(); }catch(_){} }, 250);
  setTimeout(function(){ setHdrVar(); try{ fitPlayer(); }catch(_){} }, 800);
}

// 放送終了時刻(c,p)になった瞬間に切り替えるタイマー
// YouTubeの実尺に関係なく、放送スケジュール通りに正確に切り替わる
function setEndTimer(c,p){
  clearEndTimer();
  var endMin=emOf(c,p);        // 番組終了時刻（分）
  var nowMin=nowF();            // 現在時刻（分）
  var remainMs=(endMin-nowMin)*60*1000; // 残りミリ秒
  if(remainMs<=0){
    // すでに終了時刻を過ぎている場合は即切り替え
    setTimeout(function(){onEnded();},100);
    return;
  }
  endTimer=setTimeout(function(){
    endTimer=null;
    onEnded();
  },remainMs);
}

// ── 動画ロード（ユーザー操作チェーン内で呼ぶこと・Safari対策） ──
// 字幕(YouTube CC)を強制無効化。端末の字幕設定で勝手に表示される問題への対処。
// 動画ロード毎に再表示され得るため、onReady・再生開始・ロード後に都度呼ぶ。
function killCaptions(){
  if(!ytPlayer) return;
  try{ ytPlayer.unloadModule('captions'); }catch(_){}
  try{ ytPlayer.unloadModule('cc'); }catch(_){}
  try{ ytPlayer.setOption('captions','track',{}); }catch(_){}
  try{ ytPlayer.setOption('cc','track',{}); }catch(_){}
}

// テロップを1行のまま動画幅に収める（フォントサイズを自動調整）
function fitTelop(videoW){
  var el=document.getElementById('video-telop');
  if(!el || el.style.display==='none' || !el.textContent) return;
  var availW=Math.max(80,(videoW||el.parentNode.clientWidth)-20); // 動画幅から左右マージン
  var pad=20; // 座布団の左右パディング合計(概算)
  el.style.maxWidth='none'; el.style.fontSize='16px';
  var natW=el.offsetWidth; // 16px時の自然な1行幅
  var f=16;
  if(natW>availW){ f=Math.max(8, Math.floor(16*(availW-pad)/Math.max(1,natW-pad))); }
  el.style.fontSize=f+'px';
  el.style.maxWidth=availW+'px';
}
// 出典テロップ：番組(ytId)を新規に読み込んだ時だけ、見始めから10秒表示（同一ytIdの再読込=シークでは出さない）
var _telopYtId='';
function maybeShowTelop(ytId){
  var el=document.getElementById('video-telop'); if(!el) return;
  if(ytId===_telopYtId) return; // 同じ番組の再読み込みでは再表示しない
  _telopYtId=ytId;
  var text=''; for(var i=0;i<CYCLE.length;i++){ if(CYCLE[i].ytId===ytId){ text=CYCLE[i].telop||''; break; } }
  if(el._t){clearTimeout(el._t);el._t=null;}
  if(!text){ el.style.display='none'; return; }
  el.textContent=text;
  el.classList.remove('telop-hide');
  el.style.display='block';
  try{ fitPlayer(); }catch(_){} // 表示時に動画幅へフォント調整
  el._t=setTimeout(function(){
    el.classList.add('telop-hide');
    setTimeout(function(){ if(el.classList.contains('telop-hide')) el.style.display='none'; },600);
  },10000);
}

function loadVideo(ytId,sec,msg){
  try{statsSessionStart(ytId);}catch(_){}
  try{maybeShowTelop(ytId);}catch(_){}
  clearSpinnerTimer();
  showEnded(false);
  // シークバーをリセット
  ourPlaying=false;    // 動画切替時にフラグリセット
  var pb=document.getElementById('p-bar');
  var pbfs=document.getElementById('p-bar-fs');
  if(pb){pb.classList.add('no-transition');pb.style.width='0%';}
  if(pbfs){pbfs.classList.add('no-transition');pbfs.style.width='0%';}
  // 次フレームでtransitionを戻す
  requestAnimationFrame(function(){
    if(pb)pb.classList.remove('no-transition');
    if(pbfs)pbfs.classList.remove('no-transition');
  });
  showSpinner(true,msg||'切り替え中...');
  vCurrentId=ytId; vCurrentSec=sec; // 現在の動画情報を保存
  if(ytReady&&ytPlayer){
    try{ fitPlayer(); }catch(_){} // ロード前に内部サイズ固定を保証
    ytPlayer.loadVideoById({videoId:ytId,startSeconds:sec});
    try{ fitPlayer(); }catch(_){}
    setTimeout(function(){
      try{if(ytPlayer.getPlayerState()!==1)ytPlayer.playVideo();}catch(_){}
    },500);
    setTimeout(killCaptions,300); setTimeout(killCaptions,1200); // 動画ロード毎に字幕を無効化
  }else{
    pendingYtId=ytId;pendingSec=sec;
  }
  spinnerTimer=setTimeout(function(){showSpinner(false);},60000);
}

function pauseVideo(){
  clearSpinnerTimer();

}

// ── 動画終了 ──
function onEnded(){
  // まずスピナーで画面を覆う（YouTubeのエンドスクリーン＝サムネイルを隠す）
  showSpinner(true,'切り替え中...');
  clearEndTimer();
  var ended=vP; // 今終わった番組
  var pos=nowPos();
  if(!pos){
    var wasExp=isExpanded;
    if(wasExp)closeExpand();
    setTimeout(gotoOffAir,wasExp?300:0);
    return;
  }
  isManual=false;
  // 動画が尺より短く、終了時点でまだ同じ番組のスロット内に戻ってくる場合はループ防止で次の番組を頭から
  if(pos.p===ended && CYCLE.length>1){
    var np=(ended+1)%CYCLE.length;
    vC=pos.c;vP=np;
    loadVideo(CYCLE[np].ytId,0,'次の番組を読み込んでいます...');
    setViewUI(pos.c,np);refreshLive();
    return;
  }
  // 通常/シーク後：終了時点で放送中の番組を、現在時刻に合った位置（途中からでも）で再生
  playSchedule(pos.c,pos.p);
}

// ══════════════════════════════════════════════
//  再生モード
// ══════════════════════════════════════════════
function playSchedule(c,p){
  clearEndTimer();isManual=false;isOff=false;userWantsPlay=true;
  vC=c;vP=p;
  var sec=esOf(c,p);
  loadVideo(CYCLE[p].ytId,sec,'放送中の番組に切り替えています...');
  setViewUI(c,p);refreshLive();
  // ★強制切替タイマーは使わない：今の動画は自然終了(state=0)まで再生し、終了時にライブへ復帰する
}

// ★ Safari対策：ユーザータップのコールチェーン内で直接呼ぶ
function playManual(pIdx){
  clearEndTimer();isManual=true;isOff=false;userWantsPlay=true;
  showEnded(false);
  var pos=nowPos();var c=pos?pos.c:0;
  vC=c;vP=pIdx;

  setViewUI(c,pIdx);refreshLive();

}

function gotoOffAir(){
  try{statsSessionEnd();}catch(_){}
  clearEndTimer();closeExpand();
  isOff=true;isManual=false;userWantsPlay=false;
  pauseVideo();
  // バッファリング中でも確実に停止させる遅延pause
  setTimeout(function(){
    if(isOff&&ytPlayer&&ytReady){try{ytPlayer.pauseVideo();}catch(_){}}
  },800);
  showSpinner(false);showEnded(true);
  document.getElementById('viewing-title').textContent='本日の放送は終了しました';
  document.getElementById('viewing-cat').textContent='';
  document.getElementById('onair-badge').classList.add('off');
  document.getElementById('bdot').className='bdot grey';

  document.querySelectorAll('.prow').forEach(function(r){r.classList.remove('active');});
  document.querySelectorAll('.time-chip-item').forEach(function(c){c.classList.remove('on');});
}

function hlSB(c,p){
  document.querySelectorAll('.prow').forEach(function(r,i){r.classList.toggle('active',i===p);});
  document.querySelectorAll('.time-chip-item').forEach(function(el){el.classList.remove('on');});

  if(chip){
    chip.classList.add('on');
    // sb-list内だけスクロール（ページ全体をスクロールしない）
    var list=document.getElementById('sb-list');
    var row=document.getElementById('row-'+p);
    if(list&&row){
      var listTop=list.getBoundingClientRect().top;
      var rowTop=row.getBoundingClientRect().top;
      var rowH=row.offsetHeight;
      var listH=list.offsetHeight;
      var scrollTop=list.scrollTop;
      var relTop=rowTop-listTop;
      // ★放送中の番組を常にリストの一番上へ。最下部の番組はscrollTopが自動で上限にclampされ、
      //   一番上には行かないが「見える位置」に収まる（＝ご指示通り：最下部は無理せず見えればOK）。
      list.scrollTop=scrollTop+relTop-8;
    }
  }
  // 各番組の時刻バーを現在サイクル(c)の位置へ横スクロール（現在時刻の目盛りが画面外に隠れないように）
  for(var pi=0;pi<CYCLE.length;pi++){
    var tb=document.querySelector('#row-'+pi+' .time-bar');
    var cc=document.getElementById('chip-'+pi+'-'+c);
    if(tb&&cc){
      var delta=(cc.getBoundingClientRect().left-tb.getBoundingClientRect().left)-tb.clientWidth/2+cc.offsetWidth/2;
      tb.scrollLeft+=delta;
    }
  }
}

// ══════════════════════════════════════════════
//  タップ判定（スクロールと区別）
// ══════════════════════════════════════════════
function addTap(el,onTap){
  var hasTouchSupport=('ontouchstart' in window);
  if(hasTouchSupport){
    // タッチデバイス：touchend でスクロールと区別してタップ処理
    var startX=0,startY=0,moved=false;
    el.addEventListener('touchstart',function(e){
      startX=e.touches[0].clientX;startY=e.touches[0].clientY;moved=false;
    },{passive:true});
    el.addEventListener('touchmove',function(e){
      if(Math.abs(e.touches[0].clientY-startY)>8||Math.abs(e.touches[0].clientX-startX)>8)moved=true;
    },{passive:true});
    el.addEventListener('touchend',function(e){
      if(!moved){e.preventDefault();onTap();}
    },{passive:false});
    // タッチデバイスのclickは300ms遅延があるので使わない
  }else{
    // マウス（PC/Mac）：通常のclickのみ
    el.addEventListener('click',function(){onTap();});
  }
}

// ══════════════════════════════════════════════
//  定期チェック・時計・電源・初期化
// ══════════════════════════════════════════════
// 再生/一時停止アイコンのSVGパス（グローバル。updateSeekBar等から参照。以前はtogglePlayPause内ローカルのみで
// updateSeekBarが未定義参照→例外でシークバー幅更新が実行されない不具合があった）
var pausePath='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
var playPath='<path d="M8 5v14l11-7z"/>';
// ── シークバー更新（1秒毎・実際の再生位置と連動） ──
function updateSeekBar(){
  if(!ytPlayer||!ytReady)return;
  try{
    var state=ytPlayer.getPlayerState();
    // 再生アイコンを状態に応じて更新（1秒毎に必ずポーリング）
    var isPlay=(state===1||state===3);
    // 実際に再生中(state=1)なのにスピナーが表示されていたら消す
    // state=3(バッファ中)では消さない（映像が実際に見える前にスピナーが消えるのを防ぐ）
    if(state===1&&!isOff){
      var swEl=document.getElementById('sw-ov');
      if(swEl&&swEl.style.display!=='none'){ clearSpinnerTimer();showSpinner(false); }
    }
    // state=0(終了)のバックアップ検知（onStateChangeが発火しない場合の対策）
    if(state===0&&!isOff&&!window._onEndedPending&&_endSwitchOK()){
      showSpinner(true,'切り替え中...'); // 即座にエンドスクリーンを隠す
      window._onEndedPending=true;
      setTimeout(function(){
        window._onEndedPending=false;
        if(!isOff&&_endSwitchOK()){ onEnded(); }
      },500);
    }
    if(!seekInProgress){ // シーク中はアイコンを更新しない（フリッカー防止）
      ourPlaying=isPlay;
      var icon=document.getElementById('ctrl-play-icon');
      var fsIcon=document.getElementById('fs-play-icon');
      if(icon)icon.innerHTML=isPlay?pausePath:playPath;
      if(fsIcon)fsIcon.innerHTML=isPlay?pausePath:playPath;
    }
    // 中央の半透明・再生ボタン：一時停止中（再生・バッファ中でない）かつ放送中かつ動画ロード済みで表示
    var cp=document.getElementById('center-play');
    if(cp){ cp.style.display=(!isOff && vCurrentId && state!==1 && state!==3)?'flex':'none'; }
    // シークバー更新（ドラッグ/シーク中は上書きしない）
    var dur=ytPlayer.getDuration();
    var cur=ytPlayer.getCurrentTime();
    if(dur>0 && !seekInProgress){
      var pct=Math.min(100,Math.max(0,(cur/dur)*100));
      var pb=document.getElementById('p-bar');
      if(pb)pb.style.width=pct+'%';
      var pbfs=document.getElementById('p-bar-fs');
      if(pbfs)pbfs.style.width=pct+'%';
      // 終了2秒前にスピナーを先出し（YouTubeエンドスクリーンを隠す）
      if(!isOff&&(dur-cur)<0.1&&dur>5){
        var swEl2=document.getElementById('sw-ov');
        if(swEl2&&swEl2.style.display==='none'){showSpinner(true,'切り替え中...');}
      }
    }
  }catch(e){}
}

// ══ シーク共通（30秒ボタン＋ドラッグ対応・全画面で画面が動くのを防ぐ） ══
var _lastSeekAt=0; // 直近シーク時刻。シーク直後の誤「終了」検知を無視するため
// 本当に終端付近まで再生した時だけ「動画終了」とみなす（シーク/再読み込み時の誤検知で番組が切り替わるのを防ぐ）
function _isGenuineEnd(){
  try{ var d=ytPlayer.getDuration(), c=ytPlayer.getCurrentTime(); return d>0 && c>=d-3; }catch(_){ return false; }
}
function _endSwitchOK(){ return _isGenuineEnd() && (Date.now()-_lastSeekAt>1000); }
function _seekRatioAt(barEl,clientX){var r=barEl.getBoundingClientRect();return Math.min(1,Math.max(0,(clientX-r.left)/(r.width||1)));}
function _seekVisual(ratio){
  var pb=document.getElementById('p-bar'),pbfs=document.getElementById('p-bar-fs');
  if(pb){pb.classList.add('no-transition');pb.style.width=(ratio*100)+'%';}
  if(pbfs){pbfs.classList.add('no-transition');pbfs.style.width=(ratio*100)+'%';}
  seekInProgress=true; _lastSeekAt=Date.now(); // ドラッグ中は自動更新でバーが戻らないように
}
// 30秒 相対シーク（ボタン用）
function seekRel(delta){
  if(!ytPlayer||!ytReady)return;
  var cur=0,dur=0;try{cur=ytPlayer.getCurrentTime()||0;dur=ytPlayer.getDuration()||0;}catch(_){}
  if(dur<=0)return;
  var t=cur+delta; if(t<0)t=0; if(t>dur-2)t=dur-2; // 終端の手前までに制限（シークで即終了→切替を防ぐ）
  _seekVisual(t/dur); _lastSeekAt=Date.now();
  if(isIOS&&vCurrentId){iosFirstPlay=true;try{ytPlayer.loadVideoById({videoId:vCurrentId,startSeconds:Math.floor(t)});}catch(_){}}
  else{try{ytPlayer.seekTo(t,true);}catch(_){}}
  setTimeout(function(){seekInProgress=false;},450);
}
// バーにドラッグシークを付与。commit(clientX)は指を離した時に実位置へシーク。
function attachSeekDrag(barEl,commit){
  if(!barEl||barEl._seekBound)return; barEl._seekBound=true;
  barEl.addEventListener('touchstart',function(e){
    barEl._dragging=true; e.stopPropagation();
    if(isExpanded&&typeof resetFsUiTimer==='function')resetFsUiTimer();
    if(e.touches[0])_seekVisual(_seekRatioAt(barEl,e.touches[0].clientX));
  },{passive:true});
  barEl.addEventListener('touchmove',function(e){
    if(!barEl._dragging)return;
    e.preventDefault(); e.stopPropagation(); // ★これで全画面でも画面が動かない
    if(isExpanded&&typeof resetFsUiTimer==='function')resetFsUiTimer();
    if(e.touches[0])_seekVisual(_seekRatioAt(barEl,e.touches[0].clientX));
  },{passive:false});
  barEl.addEventListener('touchend',function(e){
    if(!barEl._dragging)return; barEl._dragging=false;
    e.preventDefault(); e.stopPropagation(); // 合成clickを抑止（二重シーク防止）
    var cx=(e.changedTouches&&e.changedTouches[0])?e.changedTouches[0].clientX:null;
    if(cx!=null)commit(cx);
    setTimeout(function(){seekInProgress=false;},450);
  },{passive:false});
  barEl.addEventListener('click',function(e){e.stopPropagation();commit(e.clientX);}); // PCマウス
}

function periodicCheck(){
  if(!hasPoweredOn)return; // 放送開始前は一切の自動再生・状態変更をしない（PCで裏面音声再生になる不具合対策）
  if(isManual){refreshLive();return;}
  var pos=nowPos();
  if(!pos){
    // 放送時間外(24時以降)。今の番組を再生中なら最後まで流し、終了時(onEnded→pos=null)にoff-airへ。
    if(!isOff){
      var stx=-99; try{ stx=ytPlayer.getPlayerState(); }catch(_){}
      if(stx!==1 && stx!==3){ gotoOffAir(); } // 再生・バッファ中でなければ終了画面へ
    }
    return;
  }
  var wasOff=isOff;
  refreshLive(); // LIVE表示・lC/lP更新（タイトルは再生中の番組のまま。番組境界では強制切替しない）
  // 放送終了状態→放送開始時刻(6時等)になったら自動再生で復帰。
  // ★番組境界の変化では強制切替しない：今の動画を最後まで再生し、終了時にonEndedがライブへ復帰させる。
  if(wasOff){ playSchedule(pos.c,pos.p); }
}

function powerOn(){
  document.getElementById('power-screen').style.display='none';
  document.getElementById('main-content').style.display='block';
  // ★本体を表示した直後にヘッダー実高(--hdr-h)を測り直す（起動画面中の測定は非表示=高さ0で無効なため）＋
  //   ページのスクロール位置を0に固定（本文が固定ヘッダーの裏に潜り込む上ズレの保険）
  setHdrVar();
  requestAnimationFrame(function(){ setHdrVar(); window.scrollTo(0,0); recordNormBanner(); });
  hasPoweredOn=true;
  userWantsPlay=true;
  var pos = CYCLE.length ? nowPos() : null;
  if(!CYCLE.length){ showLoadErr(scheduleFailed?'error':'loading'); } // 番組表未取得:読み込み中/エラー（届き次第applyScheduleで自動再生）
  else if(pos){ playSchedule(pos.c,pos.p); }
  else { gotoOffAir(); }
  // iPhoneのみ: ジェスチャーチェーン内でplayVideoを直接呼ぶ
  if(isIOS&&ytPlayer&&ytReady){
    try{ytPlayer.playVideo();}catch(_){}
  }
  if(isIOS&&ytReady){ iosFirstPlay=true; } // powerOnのloadVideoByIdが最初のiOS再生
  // 放送開始後に再生が始まらない場合のリトライ（初期化直後/黒画面/自動一時停止対策）
  if(pos){
    [500,1000,1800].forEach(function(ms){
      setTimeout(function(){
        if(isOff||!userWantsPlay||!ytPlayer||!ytReady) return;
        var st=-99; try{ st=ytPlayer.getPlayerState(); }catch(_){}
        if(st===1||st===3) return; // 再生中/バッファ中ならOK
        if(ms>=1800){ forceResync(); } else { try{ ytPlayer.playVideo(); }catch(_){} }
      }, ms);
    });
  }
  // Silk/FireTVのみ: ユーザージェスチャー直後にブラウザUIを非表示にする
  // PC・iOS版には一切影響しない（isSilkがfalseのため実行されない）
  if(isSilk){
    var el=document.documentElement;
    var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
    if(req){
      try{req.call(el);}catch(e){}
    }
  }
}

      var pb = parseFloat(cs.paddingBottom)||0;

  renderSB();renderCityNews();updateClock();setHdrVar();

  loadJmaWarn();                        // 気象庁の警報（発表中は優先表示）
  setInterval(loadJmaWarn, 300000);     // 5分ごと
  setInterval(rotateCityNews, 8000);
  window.addEventListener('load', setHdrVar);
  window.addEventListener('resize', setHdrVar); // 回転・画面サイズ変化でヘッダー実高を追従（測り直し漏れの根治）
  // 回転時：全画面中はバナー固定座標を置き直し／通常表示中は「その向きの通常時バナー座標」を保存
  //   （iOSはresize直後に寸法が定まらない事があるため250ms後にもう一度。resizeとorientationchange両方で拾う保険）
  var _fsRepinOnRotate=function(){
