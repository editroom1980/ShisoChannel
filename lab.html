    }
    else{ recordNormBanner(); setTimeout(recordNormBanner,250); }
  };
  window.addEventListener('resize', _fsRepinOnRotate);
  window.addEventListener('orientationchange', _fsRepinOnRotate);
  // ビューポート凍結の監視（ホーム画面アプリのiPhoneのみ・0.4秒間隔の軽量チェック）
  if(isIOS){
    setInterval(_vpWatch, 400);
    // 正常状態を確認できたら復旧カウンタを戻す（次の凍結にまた対応できるように）
    setInterval(function(){ if(!document.hidden && !isExpanded && !_vpFrozen()){
      try{ if(sessionStorage.getItem('sc_fix_n')) sessionStorage.removeItem('sc_fix_n'); }catch(_){} } }, 5000);
  }
  // ビューポート凍結の監視（ホーム画面アプリのiPhoneのみ）。
  // ※シミュレータ実測：アプリ内ブラウザのシートを閉じてもvisibilitychange/pageshow/resizeは
  //   発火しない場合がある（アプリはシートの裏で「表示中」のまま）ため、0.4秒間隔の軽量監視＋
  //   復帰後の最初のタッチでも即チェックして遅延を最小化する。
  // ピンチ拡大縮小の禁止（2026-08-09指示）。iOSはviewportのuser-scalable=noを無視する場合があるため、
  // ピンチジェスチャー自体を止める（gesture*はiOS固有の2本指ピンチイベント＝1本指のタップ/スクロールには無影響）
  ['gesturestart','gesturechange'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, {passive:false});
  });
  document.addEventListener('touchmove', function(e){
    if(e.scale!==undefined && e.scale!==1){ e.preventDefault(); } // 2本指ピンチのみ抑止（通常スクロールは素通し）
  }, {passive:false});
  setTimeout(setHdrVar,300); setTimeout(setHdrVar,1200);
  loadRemoteSchedule(); // Firestoreから番組表を取得（未設定なら何もしない）
  statsInit(); // 視聴計測（未設定なら何もしない）
  addTap(document.getElementById('ps-btn'),powerOn);
  // YT API準備完了までボタンを「準備中」に（早押しによる再生失敗を防ぐ）
  (function(){ var b=document.getElementById('ps-btn'); if(b&&!ytReady){ b.classList.add('loading'); b.textContent='準備中…'; } })();
  setTimeout(armStartBtn,4000); // フォールバック: 4秒で必ず有効化
  setInterval(updateClock,1000);
  setInterval(periodicCheck,10000);
  setInterval(updateSeekBar,100);
  // プレイヤー枠のサイズ変化(回転/全画面/レイアウト変化)を常時監視してtransformを更新。
  // iframeの内部サイズ(1920x1080)は変えないので、YouTubeは作り直し不要のまま＝ズレない。
  if(window.ResizeObserver){
    try{ new ResizeObserver(function(){ fitPlayer(); }).observe(document.getElementById('player-wrap')); }catch(_){}
  }
  fitPlayer();
  // スポンサーバナー初期表示＋10秒ごと切り替え＋フリック切替
  updateSponsorDisplay();
  resetSponsorTimer();
  attachSponsorSwipe(document.getElementById('sponsor-banner'));
  attachSponsorSwipe(document.getElementById('fs-sponsor'));
  attachNewsSwipe(document.getElementById('sb-news'));
  // 画面回転・リサイズ時にバナーを再描画（縦↔横でコンパクト版を切替）
  window.addEventListener('resize', updateSponsorDisplay);
  window.addEventListener('orientationchange', function(){
    setTimeout(updateSponsorDisplay,100);
    // 画面回転でYouTube内部が旧サイズのまま映像が横ズレするため、寸法が確定した頃に1回だけ再レイアウト
    scheduleRelayout();
  });
  // 回転がresizeとして来る端末（iOS等）への保険。幅が変わった時＝回転時のみ再レイアウト
  // （URLバー開閉の高さ変化では発火させない＝不要なチラつき防止）。scheduleRelayoutが1回に集約。
  var _lastW=window.innerWidth;
  window.addEventListener('resize', function(){
    if(window.innerWidth===_lastW) return;
    _lastW=window.innerWidth;
    scheduleRelayout();
  });
  // スポンサーリンクから戻った時に再生を再開（タブ復帰・bfキャッシュ復元）
  // userWantsPlay基準: iOSが自動一時停止してもユーザーの再生意図があれば再開
  function resumeIfWanted(){
    if(!(ytPlayer && ytReady && !isOff && userWantsPlay)) return;
    try{ if(ytPlayer.getPlayerState()!==1) ytPlayer.playVideo(); }catch(_){}
    // iOSは一度で再生されないことがあるため少し遅延して再試行
    setTimeout(function(){
      if(!(ytPlayer && ytReady && !isOff && userWantsPlay)) return;
      var st=-99; try{ st=ytPlayer.getPlayerState(); }catch(_){}
      if(st!==1){ try{ ytPlayer.playVideo(); }catch(_){} }
    },350);
    // PCのbfキャッシュ復元で黒画面のまま固まる場合の復旧:
    // 一定時間後も再生(1)でもバッファリング(3)でもなければ現在番組を再ロード
    setTimeout(function(){
      if(!(ytPlayer && ytReady && !isOff && userWantsPlay)) return;
      var st=-99; try{ st=ytPlayer.getPlayerState(); }catch(_){}
      if(st!==1 && st!==3){ forceResync(); }
    },900);
  }
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden) resumeIfWanted();
  });
  window.addEventListener('pageshow',function(e){ resumeIfWanted(); });
  window.addEventListener('focus',function(){ resumeIfWanted(); });
  // Now Playingセッション抑制（Dynamic Islandインジケーター非表示の試み）
  if('mediaSession' in navigator){
    navigator.mediaSession.playbackState='none';
    navigator.mediaSession.metadata=null;

  setTimeout(initYTPlayer, 100);

  try{

  // ══ TV/キオスクモード(?tv) ══
  // Google TV Streamer等にFully Kioskで本ページを全画面表示する運用向け。
  // 開くだけで ①カーソル非表示 ②YT準備でき次第そのまま放送開始（未操作でも再生）
  // ③画面スリープ抑止。通常URL(?tvなし)では以下は一切実行されない。
  if(TVMODE){

    var _tvStart=function(){

      if(ytReady){ powerOn(); }     // 放送開始ボタンを押したのと同じ状態にする
      else { setTimeout(_tvStart,150); }
    };
    setTimeout(_tvStart,300);
    // 画面スリープ抑止（対応環境のみ。Fully Kiosk側「画面を消さない」でも二重に担保）
    if('wakeLock' in navigator){
      var _reqWake=function(){
        try{ navigator.wakeLock.request('screen').catch(function(){}); }catch(_){}
      };
      _reqWake();
      document.addEventListener('visibilitychange',function(){ if(!document.hidden) _reqWake(); });
    }
  }

  // カーソル自動非表示（PC全画面）
  // マウスが動いたらカーソル＋コントロールバーを表示、2秒後に両方非表示
  var _globalCursorTimer=null;
  document.addEventListener('mousemove',function(){
    document.body.classList.remove('cursor-hidden');
    if(_globalCursorTimer)clearTimeout(_globalCursorTimer);
    // PC全画面中はコントロールバーも同時に表示（fsUiTimerはここで一元管理）
    if(isExpanded){ clearFsUiTimer(); showFsUi(); }
    _globalCursorTimer=setTimeout(function(){
      var inFs=!!(document.fullscreenElement||document.webkitFullscreenElement)||isExpanded||isSilk||TVMODE;
      if(inFs){
        document.body.classList.add('cursor-hidden');
        if(isExpanded) hideFsUi(); // コントロールバーも同時に非表示
      }
    },2000);
  });

  // ctrl-play: onclick属性のみ使用（addTapのtouchend+preventDefaultがiOSで
  // ytPlayer.playVideo()のジェスチャーチェーンを切る可能性があるため除外）

  // fs-ctrl-bar の初期化
  addTap(document.getElementById('fs-play'), togglePlayPause);
  addTap(document.getElementById('fs-mute'), toggleMute);
  addTap(document.getElementById('fs-close'), closeExpand);
  // fs-vol-slider
  var fsVol=document.getElementById('fs-vol-slider');
  if(fsVol){
    fsVol.addEventListener('input',function(){
      // vol-sliderと同期してonVolSliderを呼ぶ
      var mv=document.getElementById('vol-slider');
      if(mv)mv.value=this.value;
      onVolSlider();
    });
  }
  // fs-seek-bg のシーク（doFsSeekはif文の外で定義→iOS対応）
  var doFsSeek=function(clientX,barEl){
    if(!window.ytPlayer)return;
    var rect=barEl.getBoundingClientRect();
    var ratio=Math.min(1,Math.max(0,(clientX-rect.left)/rect.width));
    if(!ytPlayer.getDuration)return;
    var dur=ytPlayer.getDuration();
    if(dur<=0)return;
    var seekPos=Math.min(ratio*dur, dur-2); if(seekPos<0)seekPos=0; // 終端手前まで（シークで即終了→切替を防ぐ）
    _lastSeekAt=Date.now();
    var pb=document.getElementById('p-bar');var pbfs=document.getElementById('p-bar-fs');
    if(pb)pb.style.width=(ratio*100)+'%';
    if(pbfs)pbfs.style.width=(ratio*100)+'%';
    if(isIOS&&vCurrentId){
      iosFirstPlay=true;
      try{ytPlayer.loadVideoById({videoId:vCurrentId,startSeconds:Math.floor(seekPos)});}catch(_){}
    }else{
      seekInProgress=true;
      setTimeout(function(){seekInProgress=false;},1500);
      try{ytPlayer.seekTo(seekPos,true);}catch(_){}
    }
  };
  var fsSeek=document.getElementById('fs-seek-bg');
  if(fsSeek){ attachSeekDrag(fsSeek, function(cx){ doFsSeek(cx, fsSeek); }); }
  // fs-ctrl-barタップ/マウス操作でタイマーリセット＋動画停止を防ぐ
  var fsBar2=document.getElementById('fs-ctrl-bar');
  if(fsBar2){
    fsBar2.addEventListener('touchstart',function(e){
      e.stopPropagation();
      if(isExpanded)resetFsUiTimer();
    },{passive:true});
    fsBar2.addEventListener('click',function(e){
      e.stopPropagation();
      if(isExpanded)resetFsUiTimer();
    });
    // マウス移動でタイマーリセット（PC全画面）
    fsBar2.addEventListener('mousemove',function(e){
      e.stopPropagation();
      if(isExpanded)resetFsUiTimer();
    });
  }
}
init();

// ============================================================
// チャンネルボタンブロック：
// iframeをpointer-events:noneにしてクリックを完全制御
// yt-block-top領域以外のクリックはYT Player APIで処理
// ============================================================
(function(){
  var wrap = document.getElementById('player-wrap');
  var blockTop = document.getElementById('yt-block-top');
  if(!wrap || !blockTop) return;

  // player-wrap全体のクリックを捕捉
  wrap.addEventListener('click', function(e) {
    // fs-ctrl-bar内のクリックは無視（全画面コントロールバー）
    var fsBar = document.getElementById('fs-ctrl-bar');
    if(fsBar && fsBar.contains(e.target)) return;

    var bRect = blockTop.getBoundingClientRect();
    // チャンネルボタン領域（yt-block-top）内のクリックは完全ブロック
    if(e.clientX >= bRect.left && e.clientX <= bRect.right &&
       e.clientY >= bRect.top  && e.clientY <= bRect.bottom) {
      e.stopPropagation();
      e.preventDefault();
      return false;
    }
    // それ以外はYT Playerでクリックをシミュレート（再生/一時停止）
    if(window.ytPlayer && window.ytPlayer.getPlayerState) {
      var state = window.ytPlayer.getPlayerState();
      if(state === 1) window.ytPlayer.pauseVideo();
      else window.ytPlayer.playVideo();
    }
  }, true);

  // タッチも同様に処理
  wrap.addEventListener('touchend', function(e) {
    var touch = e.changedTouches[0];
    var bRect = blockTop.getBoundingClientRect();
    if(touch.clientX >= bRect.left && touch.clientX <= bRect.right &&
       touch.clientY >= bRect.top  && touch.clientY <= bRect.bottom) {
      e.stopPropagation();
      e.preventDefault();
      return false;
    }
  }, true);
})();


// ── プログレスバークリックでシーク ──
// bar-bg要素のクリック・タッチに対応（PC/FireTV/iOS共通）
(function(){
  function initSeekBar(){
    var barBg = document.querySelector('#custom-ctrl .bar-bg');
    if(!barBg) return;

    function doSeek(clientX){
      if(!window.ytPlayer) return;
      var rect = barBg.getBoundingClientRect();
      var ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      var dur = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
      if(dur <= 0) return;
      var seekPos = Math.min(ratio * dur, dur-2); if(seekPos<0)seekPos=0; // 終端手前まで
      _lastSeekAt=Date.now();
      // プログレスバーの表示を即時更新
      var pb = document.getElementById('p-bar');
      var pbfs = document.getElementById('p-bar-fs');
      if(pb){pb.classList.add('no-transition');pb.style.width=(ratio*100)+'%';}
      if(pbfs){pbfs.classList.add('no-transition');pbfs.style.width=(ratio*100)+'%';}
      requestAnimationFrame(function(){if(pb)pb.classList.remove('no-transition');if(pbfs)pbfs.classList.remove('no-transition');});
      if(isIOS&&vCurrentId){
        iosFirstPlay=true;
        try{ytPlayer.loadVideoById({videoId:vCurrentId,startSeconds:Math.floor(seekPos)});}catch(_){}
      }else{
        // シーク中フラグ（1.5秒間アイコン更新を止めてフリッカー防止）
        seekInProgress=true;
        setTimeout(function(){seekInProgress=false;},1500);
        try{ytPlayer.seekTo(seekPos,true);}catch(_){}
      }
    }

    // クリック（PC）＋ドラッグ（タッチ）。全画面で画面が動かないようattachSeekDragで処理
    attachSeekDrag(barBg, function(cx){ doSeek(cx); });
  }

  // DOMが準備できてから実行
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initSeekBar);
  } else {
    initSeekBar();
  }
})();
// 右クリック・コンテキストメニューを無効化
document.addEventListener('contextmenu', function(e){e.preventDefault();});
// iframeへの長押しによるメニューを抑制
document.addEventListener('touchstart', function(){}, {passive:true});
</script>
<script>
/* ===== 計測用オーバーレイ（?debug=1 の時だけ・見た目/動作は変えない） =====
   黒帯が「枠の外(CSS)」か「YouTube内部」かを実機の数値で確定するための一時ツール。 */
(function(){
  if(!/[?&]debug=1/.test(location.search)) return;
  function saInset(){
    var p=document.getElementById('__sa_probe');
    if(!p){ p=document.createElement('div'); p.id='__sa_probe';
      p.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;'
        +'padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);'
        +'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);';
      document.body.appendChild(p);
    }
    var cs=getComputedStyle(p);
    return {L:parseFloat(cs.paddingLeft)||0,R:parseFloat(cs.paddingRight)||0,T:parseFloat(cs.paddingTop)||0,B:parseFloat(cs.paddingBottom)||0};
  }
  var ov=document.createElement('div'); ov.id='__dbg';
  ov.style.cssText='position:fixed;top:calc(env(safe-area-inset-top) + 4px);left:50%;transform:translateX(-50%);z-index:99999;'
    +'background:rgba(0,0,0,.82);color:#3f6;font:bold 12px/1.35 ui-monospace,monospace;'
    +'padding:4px 8px;border-radius:5px;pointer-events:none;white-space:pre;text-align:left;';
  function R(n){ return (n<0?'':' ')+Math.round(n); }
  function upd(){
    if(!document.body.contains(ov)) document.body.appendChild(ov);
    var sa=saInset();
    var pw=document.getElementById('player-wrap'), yt=document.getElementById('yt-player-api');
    var a=pw?pw.getBoundingClientRect():{}, c=yt?yt.getBoundingClientRect():{};
    ov.textContent=
      'SA L'+R(sa.L)+' R'+R(sa.R)+' T'+R(sa.T)+' B'+R(sa.B)+'  WIN '+window.innerWidth+'x'+window.innerHeight+'\n'+
      'PW  x'+R(a.left)+' w'+R(a.width)+' y'+R(a.top)+' h'+R(a.height)+'\n'+
      'IF  x'+R(c.left)+' w'+R(c.width)+' y'+R(c.top)+' h'+R(c.height)+'\n'+
      'gap L'+R(c.left-a.left)+' R'+R(a.right-c.right)+' T'+R(c.top-a.top)+' B'+R(a.bottom-c.bottom)+'\n'+
      'OUT '+window.outerWidth+'x'+window.outerHeight+'  SCR '+screen.width+'x'+screen.height+'\n'+
      'ORI '+(function(){try{return screen.orientation.type.replace('-primary','').replace('-secondary','2');}catch(_){return '-';}})()+
      '  CSS '+(window.matchMedia('(orientation: landscape)').matches?'LAND':'PORT')+
      '  VV '+(window.visualViewport?Math.round(window.visualViewport.width)+'x'+Math.round(window.visualViewport.height)+'@'+window.visualViewport.scale.toFixed(2):'-')+'\n'+
      'HDR '+(getComputedStyle(document.documentElement).getPropertyValue('--hdr-h').trim()||'-')+
      '  DPR '+window.devicePixelRatio+'\n'+
      'APP '+(window.navigator.standalone===true?'ホーム画面':'ブラウザ')+
      '  凍結'+((typeof _vpFrozen==='function'&&_vpFrozen())?'YES':'no')+
      '  復旧'+(function(){try{return sessionStorage.getItem('sc_fix_n')||0;}catch(_){return '-';}})()+'回';
  }
  setInterval(upd,400); setTimeout(upd,300); upd();
})();
</script>
